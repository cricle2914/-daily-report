<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <link rel="stylesheet" href="../shared.css"/>
  <link rel="stylesheet" href="../admin-layout.css"/>
  <script src="../auth.js"></script>
  <script src="../global.js"></script>
  <script>
    if (typeof API === 'undefined') {
      var SERVER_URL_KEY = 'workorder-server-url';
      var DEFAULT_API = 'http://172.40.93.99:31663';
      var API = (function() {
        try {
          var saved = localStorage.getItem(SERVER_URL_KEY);
          if (saved) return saved.replace(/\/+$/, '');
        } catch(e) {}
        return DEFAULT_API;
      })();
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    /* 页面专用样式 */
    .action-btns { display: flex; gap: 6px; }
    .sidebar-group-label {
      padding: 12px 12px 4px; font-size: 10px; font-weight: 600;
      color: var(--text3); letter-spacing: 0.5px; text-transform: uppercase;
    }
    .sidebar.collapsed .sidebar-group-label { display: none; }
    .custom-fields-section { border-top: 1px solid var(--border2); margin-top: 16px; padding-top: 14px; }
    .custom-fields-title { font-size: 12px; color: var(--text3); margin-bottom: 10px; font-weight: 500; }
    .transfer-search-wrap { position: relative; }
    .transfer-search-results {
      position: absolute; top: 100%; left: 0; right: 0; max-height: 160px;
      overflow-y: auto; background: var(--bg); border: 1px solid var(--border2);
      border-radius: 6px; margin-top: 4px; z-index: 10; display: none;
    }
    .transfer-search-results .result-item {
      padding: 7px 10px; cursor: pointer; font-size: 12px;
      color: var(--text2); transition: background 0.1s;
    }
    .transfer-search-results .result-item:hover { background: var(--bg3); }
  </style>
</head>

  <script>
    var currentPage = 'projects';
    var projects = [];
    var engineers = [];
    var editingId = null;
    var deletingId = null;
    var searchTimer = null;
    var formEngineers = [];
    var formEngSearchTimer = null;

    // ===== 列宽拖拽 =====
    var BASE_COLUMNS = [
      { key: 'name', label: '项目名', always: true },
      { key: 'manufacturer', label: '厂商' },
      { key: 'order_type', label: '订单类型' },
      { key: 'order_no', label: '订单号' },
      { key: 'customer', label: '客户' },
      { key: 'contact_name', label: '联系人' },
      { key: 'contact_phone', label: '联系电话' },
      { key: 'product_version', label: '版本' },
      { key: 'install_address', label: '安装地址' },
      { key: 'province', label: '项目所在地' },
      { key: 'agent', label: '代理商' },
      { key: 'tech_lead', label: '技术负责人' },
      { key: 'service_manager', label: '服务经理' },
      { key: 'status', label: '状态' },
      { key: 'engineers', label: '所属工程师' },
      { key: 'actions', label: '操作', always: true },
    ];
    var COLUMNS = BASE_COLUMNS.slice();
    var BASE_COL_WIDTHS = {
      name: 120, manufacturer: 70, order_type: 70, order_no: 100, customer: 100,
      contact_name: 70, contact_phone: 90, product_version: 70, install_address: 150,
      province: 90, agent: 70, tech_lead: 80, service_manager: 80, status: 70,
      engineers: 160, actions: 160
    };
    var DEFAULT_COL_WIDTHS = {};
    Object.keys(BASE_COL_WIDTHS).forEach(function(k) { DEFAULT_COL_WIDTHS[k] = BASE_COL_WIDTHS[k]; });
    var colWidths = {};
    var colResizeState = null;
    var colVisibility = {};
    var activeFilters = {};

    function loadColWidths() {
      try { var saved = localStorage.getItem('projects-col-widths' + (window._currentUser ? '_' + window._currentUser.id : '')); if (saved) colWidths = JSON.parse(saved); } catch(e) {}
      Object.keys(DEFAULT_COL_WIDTHS).forEach(function(k) { if (colWidths[k] === undefined) colWidths[k] = DEFAULT_COL_WIDTHS[k]; });
    }
    function saveColWidths() {
      try { localStorage.setItem('projects-col-widths' + (window._currentUser ? '_' + window._currentUser.id : ''), JSON.stringify(colWidths)); } catch(e) {}
    }

    function loadColVisibility() {
      try { var saved = localStorage.getItem('projects-col-visibility' + (window._currentUser ? '_' + window._currentUser.id : '')); if (saved) colVisibility = JSON.parse(saved); } catch(e) {}
    }
    function saveColVisibility() {
      try { localStorage.setItem('projects-col-visibility' + (window._currentUser ? '_' + window._currentUser.id : ''), JSON.stringify(colVisibility)); } catch(e) {}
    }

    var colOrder = [];

    function loadColOrder() {
      try { var saved = localStorage.getItem('projects-col-order' + (window._currentUser ? '_' + window._currentUser.id : '')); if (saved) colOrder = JSON.parse(saved); } catch(e) {}
    }
    function saveColOrder() {
      try { localStorage.setItem('projects-col-order' + (window._currentUser ? '_' + window._currentUser.id : ''), JSON.stringify(colOrder)); } catch(e) {}
    }

    function getVisibleColumns() {
      var cols = COLUMNS.slice();
      if (colOrder && colOrder.length > 0) {
        var ordered = [];
        colOrder.forEach(function(key) {
          var idx = cols.findIndex(function(c) { return c.key === key; });
          if (idx >= 0) { ordered.push(cols[idx]); cols.splice(idx, 1); }
        });
        cols = ordered.concat(cols);
      }
      return cols.filter(function(col) {
        if (col.always) return true;
        return colVisibility[col.key] !== false;
      });
    }

    function getVisibleColumnsRaw() {
      var cols = COLUMNS.slice();
      if (colOrder && colOrder.length > 0) {
        var ordered = [];
        colOrder.forEach(function(key) {
          var idx = cols.findIndex(function(c) { return c.key === key; });
          if (idx >= 0) { ordered.push(cols[idx]); cols.splice(idx, 1); }
        });
        cols = ordered.concat(cols);
      }
      return cols;
    }

    function onColResizeStart(e, colKey) {
      e.preventDefault();
      var th = e.currentTarget.parentElement;
      colResizeState = { key: colKey, startX: e.clientX, startW: th.offsetWidth, th: th };
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      e.currentTarget.classList.add('active');
    }
    document.addEventListener('mousemove', function(e) {
      if (!colResizeState) return;
      var diff = e.clientX - colResizeState.startX;
      var newW = Math.max(60, colResizeState.startW + diff);
      colResizeState.th.style.width = newW + 'px';
      colWidths[colResizeState.key] = newW;
    });
    document.addEventListener('mouseup', function() {
      if (!colResizeState) return;
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      var active = document.querySelector('.col-resize-handle.active');
      if (active) active.classList.remove('active');
      colResizeState = null;
      saveColWidths();
    });

    function formatDate(d) {
      if (!d) return '-';
      var date = new Date(d);
      return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
    }
    function formatDateTime(d) {
      if (!d) return '-';
      var date = new Date(d);
      return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0') +
        ' ' + String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');

    function getStatusBadge(status) {
      var map = {
        'active': '进行中', 'in_progress': '进行中', 'ongoing': '进行中', '进行中': '进行中',
        'completed': '完成', '已完成': '完成', '完成': '完成',
        'paused': '暂停', '暂停': '暂停',
        'blocked': '受阻', '受阻': '受阻',
      };
      var label = map[status] || status || '-';
      if (label === '进行中') return '<span class="badge badge-green">进行中</span>';
      if (label === '完成') return '<span class="badge badge-blue">完成</span>';
      if (label === '暂停') return '<span class="badge badge-amber">暂停</span>';
      if (label === '受阻') return '<span class="badge badge-red">受阻</span>';
      return '<span class="badge badge-blue">' + label + '</span>';
    }

    function getCellValue(p, key) {
      switch (key) {
        case 'name': return p.name || '-';
        case 'manufacturer': return p.manufacturer || '-';
        case 'order_type': return p.order_type || '-';
        case 'order_no': return p.order_no || p.orderNo || '-';
        case 'customer': return p.customer || '-';
        case 'contact_name': return p.contact_name || '-';
        case 'contact_phone': return p.contact_phone || '-';
        case 'product_version': return p.product_version || '-';
        case 'install_address': return '<span class="truncate" style="max-width:150px">' + (p.install_address || '-') + '</span>';
        case 'province': return p.province || '-';
        case 'agent': return p.agent || '-';
        case 'tech_lead': return p.tech_lead || '-';
        case 'service_manager': return p.service_manager || '-';
        case 'status': return getStatusBadge(p.status);
        case 'engineers':
          if (p.engineers && p.engineers.length > 0) {
            return p.engineers.map(function(e) { return '<span class="badge badge-blue" style="margin:1px;font-size:11px">' + (e.name || e) + '</span>'; }).join(' ');
          }
          return '<span style="color:var(--text3)">-</span>';
        case 'actions':
          var btns = '';
          btns += '<button class="btn-sm btn-secondary" onclick="openViewModal(\'' + p.id + '\')"><i class="fa-solid fa-eye"></i></button>';
          btns += '<button class="btn-sm btn-secondary" onclick="event.stopPropagation();openEditModal(\'' + p.id + '\')"><i class="fa-solid fa-pen"></i></button>';
          btns += '<button class="btn-sm btn-secondary" onclick="event.stopPropagation();openTransferModal(\'' + p.id + '\')"><i class="fa-solid fa-rotate"></i></button>';
          btns += '<button class="btn-sm btn-danger" onclick="event.stopPropagation();openDeleteModal(\'' + p.id + '\')"><i class="fa-solid fa-trash"></i></button>';
          return '<div class="action-btns">' + btns + '</div>';
        default:
          if (key.indexOf('cf_') === 0) {
            var fName = key.substring(3);
            var cfs = p.custom_fields || p.customFields || {};
            if (typeof cfs === 'string') { try { cfs = JSON.parse(cfs); } catch(e2) { cfs = {}; } }
            return cfs[fName] || '-';
          }
          return p[key] || '-';
      }
    }

    function renderTable() {
      var tbody = document.getElementById('tableBody');

      var filterKeys = Object.keys(activeFilters);
      var filtered = projects;
      if (filterKeys.length > 0) {
        filtered = projects.filter(function(p) {
          return filterKeys.every(function(key) {
            var selected = activeFilters[key];
            if (!selected || selected.length === 0) return true;
            var val = p[key] || '';
            return selected.indexOf(val) >= 0;
          });
        });
      }
      if (filtered.length === 0) { empty.style.display = 'block'; return; }
      filtered.forEach(function(p) {
        var pid = p.id;
        var tr = document.createElement('tr');
        var html = '';
        visibleCols.forEach(function(col) {
          html += '<td>' + getCellValue(p, col.key) + '</td>';
        });
        tr.innerHTML = html;
        tbody.appendChild(tr);
      });
    }

    function renderCustomFieldsInModal(values) {
      var container = document.getElementById('customFieldsContainer');
      var inner = document.getElementById('customFieldsInner');
      inner.innerHTML = '';
      if (!customFieldsDefs || customFieldsDefs.length === 0) {
        container.style.display = 'none';
        return;
      }
      container.style.display = 'block';

      for (var i = 0; i < customFieldsDefs.length; i += 2) {
        var row = document.createElement('div');
        row.className = 'form-row';
        for (var j = i; j < i + 2 && j < customFieldsDefs.length; j++) {
          var fd = customFieldsDefs[j];
          var fieldName = fd.field_name || fd.name || fd.fieldName || '';
          var fieldType = fd.field_type || fd.type || 'text';
          var fieldOptions = fd.options || [];
          var required = fd.required === true || fd.required === 'true';
          var value = (values && values[fieldName]) || '';

          var group = document.createElement('div');
          group.className = 'form-group';
          var label = document.createElement('label');
          label.textContent = fieldName + (required ? ' *' : '');
          group.appendChild(label);

          var opts = [];
          if (typeof fieldOptions === 'string') {
            opts = fieldOptions.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
          } else if (Array.isArray(fieldOptions)) {
            opts = fieldOptions;
          }

          if (opts.length > 0 && (fieldType === 'select' || fieldType === 'dropdown')) {
            var select = document.createElement('select');
            select.className = 'cf-field';
            select.dataset.fieldName = fieldName;
            var emptyOpt = document.createElement('option');
            emptyOpt.value = '';
            emptyOpt.textContent = '请选择';
            select.appendChild(emptyOpt);
            opts.forEach(function(o) {
              var opt = document.createElement('option');
              opt.value = o;
              opt.textContent = o;
              if (o === value) opt.selected = true;
              select.appendChild(opt);
            });
            group.appendChild(select);
          } else {
            var input = document.createElement('input');
            input.type = fieldType === 'number' ? 'number' : fieldType === 'date' ? 'date' : 'text';
            input.className = 'cf-field';
            input.dataset.fieldName = fieldName;
            input.value = value;
            input.placeholder = '请输入' + fieldName;
            group.appendChild(input);
          }
          row.appendChild(group);
        }
        inner.appendChild(row);
      }
    }

    function syncFormFieldToConfig(fieldKey, inputId, explicitVal) {
      var cfg = fieldFilterConfigs[fieldKey];
      var el = document.getElementById(inputId);
      if (!el) return;
      var currentVal = explicitVal !== undefined ? explicitVal : el.value;
      var hasOptions = cfg && cfg.filterable && cfg.options && cfg.options.length > 0;
      var isSelect = el.tagName === 'SELECT';

      if (hasOptions && isSelect) {
        // 更新已有 select 的选项
        el.innerHTML = '';
        var emptyOpt = document.createElement('option');
        emptyOpt.value = ''; emptyOpt.textContent = '请选择';
        el.appendChild(emptyOpt);
        cfg.options.forEach(function(opt) {
          var option = document.createElement('option');
          option.value = opt; option.textContent = opt;
          if (opt === currentVal) option.selected = true;
          el.appendChild(option);
        });
      } else if (hasOptions && !isSelect) {
        // input → select
        var select = document.createElement('select');
        select.id = inputId;
        var emptyOpt = document.createElement('option');
        emptyOpt.value = ''; emptyOpt.textContent = '请选择';
        select.appendChild(emptyOpt);
        cfg.options.forEach(function(opt) {
          var option = document.createElement('option');
          option.value = opt; option.textContent = opt;
          if (opt === currentVal) option.selected = true;
          select.appendChild(option);
        });
        el.parentNode.replaceChild(select, el);
      } else if (!hasOptions && isSelect) {
        // select → input（字段配置移除了选项）
        var input = document.createElement('input');
        input.type = 'text';
        input.id = inputId;
        input.placeholder = {
          manufacturer: '输入厂商', order_type: '输入订单类型', customer: '输入客户',
          agent: '输入代理商', contact_name: '输入联系人', contact_phone: '输入联系电话',
          tech_lead: '输入技术负责人', service_manager: '输入服务经理'
        }[fieldKey] || '';
        input.value = currentVal;
        el.parentNode.replaceChild(input, el);
      }
    }

    async function saveProject() {
      var name = document.getElementById('editName').value.trim();
      if (!name) { showToast('请输入项目名', 'error'); return; }
      var province = document.getElementById('editProvince').value;
      if (!province) { showToast('请选择项目所在地', 'error'); return; }
      var body = {
        name: name,
        order_no: document.getElementById('editOrderNo').value.trim(),
        customer: document.getElementById('editCustomer').value.trim(),
        order_type: document.getElementById('editOrderType').value.trim(),
        contact_name: document.getElementById('editContact').value.trim(),
        contact_phone: document.getElementById('editContactPhone').value.trim(),
        product_version: document.getElementById('editVersion').value.trim(),
        install_address: document.getElementById('editAddress').value.trim(),
        province: province,
        manufacturer: document.getElementById('editManufacturer').value.trim(),
        agent: document.getElementById('editAgent').value.trim(),
        tech_lead: document.getElementById('editTechLead').value.trim(),
        service_manager: document.getElementById('editServiceManager').value.trim(),
        status: document.getElementById('editStatus').value,
        custom_fields: collectCustomFieldValues()
      };
      try {
        var url = editingId ? API + '/api/admin/projects/' + editingId : API + '/api/admin/projects';
        var method = editingId ? 'PUT' : 'POST';
        var res = await fetch(url, { method: method, headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify(body) });
        if (!res.ok) { var err = await res.json(); throw new Error(err.message || err.error || '保存失败'); }
        // 同步工程师
        var projectId = editingId;
        if (!projectId) {
          var resData = await res.json();
          projectId = resData.id || (resData.data && resData.data.id) || (resData.project && resData.project.id);
        }
        if (projectId) {
          var originalEngineers = editingId ? (projects.find(function(x) { return x.id == editingId || x.id === editingId; }) || {}).engineers || [] : [];
          var originalIds = originalEngineers.map(function(e) { return e.id; });
          var formIds = formEngineers.map(function(e) { return e.id; });
          // 移除取消选择的工程师
          var toRemove = originalIds.filter(function(id) { return formIds.indexOf(id) === -1; });
          for (var i = 0; i < toRemove.length; i++) {
            try { await fetch(API + '/api/admin/projects/' + projectId + '/engineers/' + toRemove[i], { method: 'DELETE', credentials: 'include' }); } catch(e) {}
          }
          // 添加新选择的工程师
          var toAdd = formIds.filter(function(id) { return originalIds.indexOf(id) === -1; });
          for (var j = 0; j < toAdd.length; j++) {
            try { await fetch(API + '/api/admin/projects/' + projectId + '/engineers', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify({ engineer_id: toAdd[j] }) }); } catch(e) {}
          }
        }
        showToast(editingId ? '更新成功' : '创建成功');
        closeModal('formModal');
        loadData();
      } catch (e) {
        showToast('操作失败: ' + e.message, 'error');
      }
    }

      _editFieldOpts = _editFieldOpts.filter(function(v) { return v !== val; });
      renderEditOptChips();
    }

    function renderEditOptChips() {
      var container = document.getElementById('editFieldOptChips');
      container.innerHTML = '';
      _editFieldOpts.forEach(function(opt) {
        var chip = document.createElement('span');
        chip.style.cssText = 'display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:rgba(255,255,255,0.08);border-radius:4px;font-size:11px;color:var(--text)';
        chip.textContent = opt;
        var rm = document.createElement('i');
        rm.className = 'fa-solid fa-xmark';
        rm.style.cssText = 'cursor:pointer;opacity:0.5;font-size:10px';
        rm.onclick = function() { removeEditOpt(opt); };
        chip.appendChild(rm);
        container.appendChild(chip);
      });
    }

    function saveFieldEdit() {
      var isUnique = document.getElementById('editFieldUnique').value === '1';
      var mode = document.getElementById('editFieldMode').value;
      var fieldType = document.getElementById('editFieldType').value;
      var filterable = !isUnique && mode === 'filterable';
      var unique = isUnique;
      var opts = filterable ? _editFieldOpts : [];
      var data = { filterable: filterable, unique: unique, options: opts, field_type: fieldType };
      saveFieldFilter(_editFieldKey, data);
      if (!fieldFilterConfigs[_editFieldKey]) fieldFilterConfigs[_editFieldKey] = {};
      fieldFilterConfigs[_editFieldKey].filterable = filterable;
      fieldFilterConfigs[_editFieldKey].unique = unique;
      fieldFilterConfigs[_editFieldKey].options = opts;
      document.getElementById('editFieldModal').style.display = 'none';
      renderFieldConfigList();
      renderTableHeader();
      showToast('字段配置已保存');
    }

    async function addCustomField() {
      var name = document.getElementById('newFieldName').value.trim();
      if (!name) { showToast('请输入字段名称', 'error'); return; }
      var type = document.getElementById('newFieldType').value;
      var body = { field_name: name, field_type: type, target_type: 'projects' };
      if (type === 'select' && fieldOptions.length > 0) {
        body.options = fieldOptions;
      }
      try {
        var res = await fetch(API + '/api/admin/custom-fields', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify(body) });
        if (!res.ok) { var err = await res.json(); throw new Error(err.message || err.error || '添加失败'); }
        showToast('字段添加成功');
        document.getElementById('newFieldName').value = '';
        document.getElementById('newFieldOptionInput').value = '';
        fieldOptions = [];
        renderOptionChips();
        await loadCustomFields();
        renderFieldConfigList();
      } catch (e) { showToast('添加失败: ' + e.message, 'error'); }
    }

    async function deleteCustomField(id) {
      if (!id) { showToast('无法删除此字段', 'error'); return; }
      if (!confirm('确定要删除该自定义字段吗？')) return;
      try {
        var res = await fetch(API + '/api/admin/custom-fields/' + id, { method: 'DELETE', credentials: 'include' });
        if (!res.ok) { var err = await res.json(); throw new Error(err.message || err.error || '删除失败'); }
        showToast('字段已删除');
        await loadCustomFields();
        renderFieldConfigList();
      } catch (e) { showToast('删除失败: ' + e.message, 'error'); }
    }

    // ========== 项目交接 ==========
    var transferProjectId = null;
    var transferProjectEngineers = [];
    var transferSearchTimer = null;
    var transferSelectedToId = null;

    function openTransferModal(id) {
      var p = projects.find(function(x) { return x.id == id || x.id === id; });
      if (!p) return;
      transferProjectId = id;
      transferProjectEngineers = p.engineers || [];
      transferSelectedToId = null;

      var select = document.getElementById('transferFromEngineer');
      select.innerHTML = '';
      if (transferProjectEngineers.length === 0) {
        var opt = document.createElement('option');
        opt.value = '';
        opt.textContent = '无 (新分配)';
        select.appendChild(opt);
      } else {
        var emptyOpt = document.createElement('option');
        emptyOpt.value = '';
        emptyOpt.textContent = '请选择';
        select.appendChild(emptyOpt);
        transferProjectEngineers.forEach(function(e) {
          var opt = document.createElement('option');
          opt.value = e.id;
          opt.textContent = e.name + (e.abbr ? ' (' + e.abbr + ')' : '');
          select.appendChild(opt);
        });
        // 默认选中第一个工程师
        select.value = transferProjectEngineers[0].id;
      }
      document.getElementById('transferTargetSearch').value = '';
      document.getElementById('transferTargetSearch').disabled = false;
      document.getElementById('transferSearchResults').style.display = 'none';
      setTimeout(function() { document.getElementById('transferTargetSearch').focus(); }, 100);
      var today = new Date();
      document.getElementById('transferDate').value = today.getFullYear() + '-' +
        String(today.getMonth() + 1).padStart(2, '0') + '-' +
        String(today.getDate()).padStart(2, '0');

      document.getElementById('transferModal').style.display = 'flex';
    }

    document.getElementById('transferFromEngineer').addEventListener('change', function() {
      var targetInput = document.getElementById('transferTargetSearch');
      transferSelectedToId = null;
      targetInput.value = '';
      targetInput.disabled = false;
      document.getElementById('transferSearchResults').style.display = 'none';
      setTimeout(function() { targetInput.focus(); }, 100);
    });

    document.getElementById('transferTargetSearch').addEventListener('input', function() {
      searchTransferTarget(this.value);
    });
    document.getElementById('transferTargetSearch').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        var firstItem = document.querySelector('#transferSearchResults .result-item');
        if (firstItem && firstItem.style.cursor !== 'default') {
          firstItem.click();
        }
      }
    });

    function selectTransferTarget(id, name) {
      transferSelectedToId = id;
      document.getElementById('transferTargetSearch').value = name;
      document.getElementById('transferSearchResults').style.display = 'none';
    }

    function searchTransferTarget(query) {
      clearTimeout(transferSearchTimer);
      var container = document.getElementById('transferSearchResults');
      if (!query || !query.trim()) {
        container.style.display = 'none';
        return;
      }
      transferSearchTimer = setTimeout(function() {
        fetch(API + '/api/admin/engineers?all=1&search=' + encodeURIComponent(query.trim()), { credentials: 'include' })
          .then(function(res) { return res.json(); })
          .then(function(data) {
            var list = Array.isArray(data) ? data : (data.engineers || data.data || []);
            var fromId = document.getElementById('transferFromEngineer').value;
            var existingIds = transferProjectEngineers.map(function(e) { return e.id; });
            var filtered = list.filter(function(e) {
              return String(e.id) !== String(fromId) && existingIds.indexOf(e.id) === -1;
            });
            container.innerHTML = '';
            if (filtered.length === 0) {
              container.innerHTML = '<div class="result-item" style="color:var(--text3);cursor:default">未找到匹配的工程师</div>';
              container.style.display = 'block';
              return;
            }
            container.style.display = 'block';
            filtered.forEach(function(e) {
              var div = document.createElement('div');
              div.className = 'result-item';
              div.textContent = e.name + (e.department_name ? ' (' + e.department_name + ')' : '');
              div.addEventListener('mousedown', function() {
                selectTransferTarget(e.id, e.name);
              });
              container.appendChild(div);
            });
            // 唯一结果自动选中
            if (filtered.length === 1) {
              selectTransferTarget(filtered[0].id, filtered[0].name);
              container.style.display = 'none';
            }
          })
          .catch(function() {
            container.innerHTML = '<div class="result-item" style="color:var(--text3);cursor:default">搜索失败</div>';
            container.style.display = 'block';
          });
      }, 300);
    }

    document.addEventListener('click', function(e) {
      // 关闭交接弹窗中的搜索结果
      var transferWrap = document.getElementById('transferModal');
      if (!e.target.closest('#transferModal .transfer-search-wrap')) {
        var tr = document.getElementById('transferSearchResults');
        if (tr) tr.style.display = 'none';
      }
      // 关闭表单中的工程师搜索结果
      if (!e.target.closest('#formModal .transfer-search-wrap')) {
        var fr = document.getElementById('editEngineerSearchResults');
        if (fr) fr.style.display = 'none';
      }
    });

    function closeTransferModal() {
      document.getElementById('transferModal').style.display = 'none';
      transferProjectId = null;
      transferProjectEngineers = [];
      transferSelectedToId = null;
      clearTimeout(transferSearchTimer);
    }

    document.getElementById('transferModal').addEventListener('click', function(e) {
      if (e.target === this) closeTransferModal();
    });

    async function confirmTransfer() {
      var fromId = document.getElementById('transferFromEngineer').value;
      var transferDate = document.getElementById('transferDate').value;
      var toId = transferSelectedToId;

      if (!toId) { showToast('请选择目标工程师', 'error'); return; }
      if (!transferDate) { showToast('请选择交接日期', 'error'); return; }

      try {
        var res;
        if (!fromId) {
          // 项目无工程师，直接分配（不使用 transfer 接口）
          res = await fetch(API + '/api/admin/projects/' + transferProjectId + '/engineers', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ engineer_id: toId })
          });
        } else {
          // 有来源工程师，使用交接接口
          res = await fetch(API + '/api/admin/projects/' + transferProjectId + '/transfer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({
              from_engineer_id: parseInt(fromId),
              to_engineer_id: toId,
              transfer_date: transferDate
            })
          });
        }
        if (!res.ok) { var err = await res.json(); throw new Error(err.message || err.error || '交接失败'); }
        showToast('项目交接成功');
        closeTransferModal();
        loadData();
      } catch (e) {
        showToast('交接失败: ' + e.message, 'error');
      }
    }

    (async function init() {
      restoreSidebar();
      var user = await checkAuth();
      if (!user) return;
      // 列设置对所有角色可见（除查看者），字段配置仅管理员
      if (user.role !== 'viewer') {
        document.getElementById('colSettingsBtn').style.display = 'inline-flex';
      }
      if (user.role === 'admin') {
        document.getElementById('fieldConfigBtn').style.display = 'inline-flex';
      }
      window._currentUser = user;
      setActiveNav(currentPage);
      loadColOrder();
      loadColVisibility();
      renderTableHeader();
      await loadEngineers();
      await loadCustomFields();
      await loadFieldFilters();
      renderTableHeader();
      loadData();
    })();
  </script>
</body>
</html>
