<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>实施工程师日报</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" id="app">
    <!-- ====== 顶部导航栏 ====== -->
    <div class="top-bar">
      <div class="avatar" id="avatar">-</div>
      <span class="engineer-name" id="engineerName">请选择工程师</span>
      <div class="top-bar-progress" id="topBarProgress">
        <div class="top-bar-prog-step active"></div>
        <div class="top-bar-prog-step"></div>
        <div class="top-bar-prog-step"></div>
        <div class="top-bar-prog-step"></div>
        <div class="top-bar-prog-step"></div>
      </div>
    </div>

    <!-- ====== Page 1: 选工程师 & 选项目 ====== -->
    <div class="page active" id="page-1">
      <!-- 搜索展开背景 -->
      <div class="search-backdrop" id="searchBackdrop"></div>

      <!-- 页面英雄区域 -->
      <div class="page1-hero">
        <h1 class="page1-greeting">
          <span class="greeting-good">Good</span><br>
          <span class="greeting-day">day!</span>
        </h1>
        <p class="page1-sub" id="typingSub">
          <span class="sub-line1" id="typingLine1"></span><br>
          <span class="sub-line2" id="typingLine2"></span><span class="type-cursor">|</span>
        </p>
      </div>

      <!-- 搜索 -->
      <div class="search-wrap">
        <input class="search-box" id="searchInput" type="text" placeholder="哪位天才呀！？" autocomplete="off">
        <div class="search-dropdown" id="searchDropdown"></div>
      </div>
    </div>

    <!-- ====== Page 2: 选择项目 ====== -->
    <div class="page" id="page-2">
      <!-- 项目列表 -->
      <div id="projectList" class="project-list"></div>

      <button class="no-project-btn" id="noProjectBtn" onclick="skipToTomorrow()">今日暂无项目，直接填写明日去向 →</button>

      <button class="expand-all-btn" id="expandAllBtn">展开全部 ▾</button>

      <!-- 下一步 -->
      <div id="nextStepArea" class="hidden next-step-area">
        <button class="btn btn-primary btn-block" id="nextToReportBtn">填写今日日报</button>
      </div>

      <!-- 底部搜索工程师 -->
      <div class="page2-search-backdrop" id="searchBackdrop2"></div>
      <div class="page2-search-area">
        <div class="page2-search-hint">需要切换工程师？</div>
        <div class="search-wrap" style="margin-top:0;padding:0;position:relative">
          <input class="search-box" id="searchInput2" type="text" placeholder="搜索其他工程师…" autocomplete="off">
          <div class="search-dropdown" id="searchDropdown2"></div>
        </div>
      </div>
    </div>

    <!-- ====== Page-2 展开遮罩（仅浏览项目名称、工单号） ====== -->
    <div class="p2-expand-backdrop hidden" id="p2ExpandBackdrop"></div>
    <div class="p2-expand-container hidden" id="p2ExpandContainer">
      <div class="p2-expand-header">
        <span class="p2-expand-title">全部项目</span>
        <button class="p2-expand-close" id="p2ExpandClose">✕</button>
      </div>
      <div id="p2ExpandList"></div>
    </div>

    <!-- ====== Page 3: 编辑日报 ====== -->
    <div class="page" id="page-3">
      <!-- 项目概要 -->
      <div class="collapse-card" id="projectSummary">
        <div class="collapse-card-header">
          <div class="collapse-card-title-area" id="collapseTitleArea">
            <div id="reportProjectName" style="font-weight:600;font-size:16px"></div>
            <div id="reportImplDays" style="font-size:13px;color:var(--text-muted);margin-top:4px"></div>
          </div>
          <button class="edit-proj-btn-inline" id="editProjBtnInline">编辑项目信息</button>
        </div>
        <div class="collapse-card-body" id="projectDetailBody"></div>
      </div>

      <!-- 今日计划 -->

      <div class="form-card">
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label">今日计划</label>
          <input class="form-input" id="planTitle" placeholder="例：AS7升级验证、文档整理" required style="padding:11px 13px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text);font-size:14px;font-family:inherit;outline:none;width:100%">
        </div>
      </div>

      <!-- 工作内容 -->
      <div class="task-section">
        <div class="section-header">工作内容</div>
        <div id="taskList" class="task-list">
          <div class="task-item">
            <span class="task-num">1</span>
            <input class="form-input task-input" placeholder="输入工作任务">
            <button class="task-del-btn" onclick="removeTask(this)">删除</button>
          </div>
        </div>
        <button class="add-task-btn" onclick="addTask()">＋ 添加工作项</button>
      </div>

      <!-- 进度 -->
      <div class="progress-section">
        <div class="section-header">进度</div>
        <div class="progress-display">
          <span class="progress-value" id="progressValue">0</span>
          <span class="progress-percent">%</span>
        </div>
        <div class="progress-slider-wrap">
          <input class="progress-slider" id="progressSlider" type="range" min="0" max="100" value="0">
          <div class="progress-marker" id="progressMarker">
            <span class="progress-marker-label" id="progressMarkerLabel"></span>▼
          </div>
        </div>
        <div class="status-btns">
          <button class="status-btn complete" data-status="complete" onclick="selectStatus(this)">✔ 完成</button>
          <button class="status-btn ongoing" data-status="ongoing" onclick="selectStatus(this)">● 进行中</button>
          <button class="status-btn blocked" data-status="blocked" onclick="selectStatus(this)">✖ 有阻碍</button>
        </div>
      </div>

      <!-- 下一步计划（进行中时显示） -->
      <div class="form-card" id="nextPlanCard" style="margin-top:16px;display:block">
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label">下一步计划</label>
          <textarea class="form-input" id="nextPlan" placeholder="请描述下一步计划…" rows="3"></textarea>
        </div>
      </div>

      <!-- 遗留问题（有阻碍时显示） -->
      <div class="form-card" id="issuesCard" style="margin-top:16px;display:none">
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label">遗留问题</label>
          <textarea class="form-input" id="issues" placeholder="无" rows="3"></textarea>
        </div>
      </div>

      <!-- 底部操作栏 -->
      <div class="action-bar">
        <button class="btn btn-secondary" onclick="showPage('page-2')">← 返回</button>
        <button class="btn btn-primary" id="submitReportBtn" onclick="submitReport()">提交日报</button>
      </div>
    </div>

    <!-- ====== Page 4: 明日去向 ====== -->
    <div class="page" id="page-4">
      <!-- 成功提示 -->
      <div class="success-bar" id="reportSuccessBar">
        <div>
          <span class="success-icon">✔</span>
          <span class="success-title" id="reportSuccessTitle">日报已提交</span>
        </div>
        <div class="summary" id="reportSummary"></div>
      </div>

      <h1 class="page4-title">Done.<br>Nice!</h1>

      <!-- 去向选择 -->
      <div style="margin-top:4px">
        <div style="font-size:17px;font-weight:600;margin-bottom:4px;color:var(--text)">明日去向</div>
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:12px">请选择明天的安排</div>
      </div>

      <div class="grid-2x2" id="destinationGrid">
        <div class="grid-card purple" data-dest="existing_project" onclick="selectDestination(this)">
          <div class="grid-icon">📋</div>
          <div class="grid-label">已有项目</div>
        </div>
        <div class="grid-card blue" data-dest="new_project" onclick="selectDestination(this)">
          <div class="grid-icon">🆕</div>
          <div class="grid-label">新项目</div>
        </div>
        <div class="grid-card green" data-dest="back_to_office" onclick="selectDestination(this)">
          <div class="grid-icon">🏢</div>
          <div class="grid-label">回公司</div>
        </div>
        <div class="grid-card orange" data-dest="other" onclick="selectDestination(this)">
          <div class="grid-icon">📝</div>
          <div class="grid-label">其他</div>
        </div>
      </div>

      <!-- 已有项目 -->
      <div class="destination-panel" id="panel-existing_project">
        <div class="form-label">选择项目</div>
        <div id="destProjectList"></div>
      </div>

      <!-- 新项目 -->
      <div class="destination-panel" id="panel-new_project">
        <div class="form-group">
          <label class="form-label">客户名 <span class="required-mark">*</span></label>
          <input class="form-input" id="newProjCustomer" placeholder="请输入客户名">
        </div>
        <div class="form-group">
          <label class="form-label">项目名 <span class="required-mark">*</span></label>
          <input class="form-input" id="newProjName" placeholder="请输入项目名">
        </div>
        <div class="form-group">
          <label class="form-label">工单号</label>
          <input class="form-input" id="newProjOrder" placeholder="可选">
        </div>
        <div class="form-group">
          <label class="form-label">工单类型</label>
          <input class="form-input" id="newProjOrderType" placeholder="可选">
        </div>
        <div class="form-group">
          <label class="form-label">联系人</label>
          <input class="form-input" id="newProjContact" placeholder="可选">
        </div>
        <div class="form-group">
          <label class="form-label">电话</label>
          <input class="form-input" id="newProjPhone" placeholder="可选">
        </div>
        <div class="form-group">
          <label class="form-label">版本</label>
          <input class="form-input" id="newProjVersion" placeholder="可选">
        </div>
        <div class="form-group">
          <label class="form-label">地址</label>
          <input class="form-input" id="newProjAddress" placeholder="可选">
        </div>
        <div class="form-group">
          <label class="form-label">厂商名称</label>
          <input class="form-input" id="newProjManufacturer" placeholder="可选">
        </div>
        <div class="form-group">
          <label class="form-label">代理商</label>
          <input class="form-input" id="newProjAgent" placeholder="可选">
        </div>
        <div class="form-group">
          <label class="form-label">技术负责人</label>
          <input class="form-input" id="newProjTechLead" placeholder="可选">
        </div>
        <div class="form-group">
          <label class="form-label">服务经理</label>
          <input class="form-input" id="newProjServiceManager" placeholder="可选">
        </div>
      </div>

      <!-- 回公司 -->
      <div class="destination-panel" id="panel-back_to_office">
        <div style="background:var(--green-bg);border-radius:8px;padding:16px;color:var(--green);font-size:15px;text-align:center">
          ✔ 明日回公司办公，无需额外信息
        </div>
      </div>

      <!-- 其他 -->
      <div class="destination-panel" id="panel-other">
        <div class="form-group">
          <label class="form-label">说明原因 <span class="required-mark">*</span></label>
          <textarea class="form-input" id="otherReason" placeholder="请输入原因" rows="3"></textarea>
        </div>
      </div>

      <!-- 提交 -->
      <div style="margin-top:24px">
        <button class="btn btn-primary btn-block" id="submitTomorrowBtn" onclick="submitTomorrow()">
          确认提交并完成
        </button>
      </div>
    </div>

    <!-- ====== Page-3 项目编辑遮罩 ====== -->
    <div class="proj-expand-backdrop hidden" id="p3ExpandBackdrop"></div>
    <div class="proj-expand-container hidden" id="p3ExpandContainer">
      <div class="proj-expand-header">
        <span class="proj-expand-title">编辑项目信息</span>
        <button class="proj-expand-close" id="p3ExpandClose">✕</button>
      </div>
      <div id="p3ExpandList"></div>
    </div>

    <!-- ====== Page 5: 完成 ====== -->
    <div class="page" id="page-5">
      <div class="complete-container">
        <div class="complete-icon">🎉</div>
        <div class="complete-title">全部完成！</div>
        <div class="complete-subtitle">感谢提交，领导端已实时更新</div>
        <div class="stats-grid" id="finalStats"></div>
        <button class="btn btn-primary btn-block" style="margin-top:28px" onclick="location.reload()">
          重新开始
        </button>
      </div>
    </div>

    <!-- ====== 新建项目抽屉 ====== -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
    <div class="drawer" id="drawer">
      <div class="drawer-handle"></div>
      <div class="drawer-title">新建项目</div>
      <div class="form-group">
        <label class="form-label">客户名 <span class="required-mark">*</span></label>
        <input class="form-input" id="drawerCustomer" placeholder="请输入客户名">
      </div>
      <div class="form-group">
        <label class="form-label">项目名 <span class="required-mark">*</span></label>
        <input class="form-input" id="drawerName" placeholder="请输入项目名">
      </div>
      <div class="form-group">
        <label class="form-label">工单号</label>
        <input class="form-input" id="drawerOrder" placeholder="可选">
      </div>
      <div class="form-group">
        <label class="form-label">工单类型</label>
        <input class="form-input" id="drawerOrderType" placeholder="可选">
      </div>
      <div class="form-group">
        <label class="form-label">联系人</label>
        <input class="form-input" id="drawerContact" placeholder="可选">
      </div>
      <div class="form-group">
        <label class="form-label">电话</label>
        <input class="form-input" id="drawerPhone" placeholder="可选">
      </div>
      <div class="form-group">
        <label class="form-label">版本</label>
        <input class="form-input" id="drawerVersion" placeholder="可选">
      </div>
      <div class="form-group">
        <label class="form-label">地址</label>
        <input class="form-input" id="drawerAddress" placeholder="可选">
      </div>
      <div class="form-group">
        <label class="form-label">厂商名称</label>
        <input class="form-input" id="drawerManufacturer" placeholder="可选">
      </div>
      <div class="form-group">
        <label class="form-label">代理商</label>
        <input class="form-input" id="drawerAgent" placeholder="可选">
      </div>
      <div class="form-group">
        <label class="form-label">技术负责人</label>
        <input class="form-input" id="drawerTechLead" placeholder="可选">
      </div>
      <div class="form-group">
        <label class="form-label">服务经理</label>
        <input class="form-input" id="drawerServiceManager" placeholder="可选">
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:8px" onclick="createProject()">创建并选择</button>
    </div>

    <!-- ====== 工时填写弹窗（毛玻璃） ====== -->
    <div class="hours-overlay hidden" id="hoursOverlay">
      <div class="hours-modal">
        <div class="hours-modal-title" id="hoursModalTitle">工时</div>
        <div class="hours-modal-desc" id="hoursModalDesc">请填写实际工时</div>
        <div class="hours-input-area">
          <input type="number" class="hours-input" id="hoursInput" min="0" max="24" step="0.5" placeholder="0">
          <span class="hours-unit">小时</span>
        </div>
        <div class="hours-error hidden" id="hoursError">请输入 0~24 的数字</div>
        <button class="btn btn-primary btn-block" id="confirmHoursBtn" style="margin-top:18px">确认</button>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
