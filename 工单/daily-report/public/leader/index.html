<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日汇报 - 领导看板</title>
  <link rel="stylesheet" href="leader.css">
  <style>
    .tag { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600; }
    .tag-field { background:rgba(79,142,247,.15); color:var(--accent); }
    .tag-office { background:rgba(68,204,119,.15); color:var(--success); }
    .tag-other { background:rgba(255,170,0,.15); color:var(--warning); }
    .missing { color:var(--danger) !important; font-weight:700; }
  </style>
</head>
<body>
  <!-- 认证遮罩 -->
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-box">
      <h2>统计面板</h2>
      <p>请输入账户密码</p>
      <div class="error" id="authError">用户名或密码错误</div>
      <input class="form-input" id="authUsername" type="text" placeholder="用户名"
        style="margin-bottom:8px" autofocus>
      <input class="form-input" id="authPassword" type="password" placeholder="密码"
        onkeydown="if(event.key==='Enter')doAuth()">
      <button class="btn btn-primary" id="authBtn" onclick="doAuth()">进入</button>
    </div>
  </div>

  <div class="layout" id="mainContent" style="display:none">
    <div class="sidebar">
      <div class="sidebar-title">统计面板</div>
      <div class="sidebar-nav">
        <a class="nav-item active" href="index.html">今日概览</a>
        <a class="nav-item" href="overview.html">日报概览</a>
        <a class="nav-item" href="attendance.html">出勤格子</a>
        <a class="nav-item" href="engineer.html">工程师概况</a>
        <a class="nav-item" href="stats.html">工时统计</a>
      </div>
      <div style="padding:12px 20px;border-top:1px solid var(--border)">
        <span style="font-size:11px;color:var(--text-dim)">统计面板 v1.0</span>
      </div>
    </div>
    <div class="main">
      <div class="topbar">
        <span class="topbar-user" id="topbarUser"></span>
        <span class="topbar-user" id="topbarRole"></span>
        <button class="topbar-btn" onclick="logout()">退出</button>
      </div>

      <div class="page-title">今日概览</div>

      <div class="stats-row" id="statsRow">
        <div class="stat-card">
          <div class="num" id="totalCount">-</div>
          <div class="lbl">在职工程师</div>
        </div>
        <div class="stat-card">
          <div class="num" id="submittedCount">-</div>
          <div class="lbl">已提交</div>
        </div>
        <div class="stat-card">
          <div class="num" id="notSubmittedCount" style="color:var(--danger)">-</div>
          <div class="lbl">未提交</div>
        </div>
        <div class="stat-card">
          <div class="num" id="fieldCount">-</div>
          <div class="lbl">在外实施</div>
        </div>
      </div>

      <div class="card" id="missingCard" style="display:none">
        <div class="card-title" style="color:var(--danger)">⚠ 应提交但未提交</div>
        <div id="missingList"></div>
      </div>

      <div class="card">
        <div class="card-title">工程师状态</div>
        <div id="engineerList"></div>
      </div>
    </div>
  </div>
  <script src="/admin/admin.js"></script>
  <script>
    // ====== viewer 认证 ======
    async function checkAuth() {
      try {
        const res = await fetch('/api/leader/me');
        const data = await res.json();
        if (data.success) {
          document.getElementById('authOverlay').style.display = 'none';
          document.getElementById('mainContent').style.display = '';
          if (data.data.role) {
            document.getElementById('topbarRole').textContent = data.data.role === 'viewer' ? '查看者' : '管理员';
          }
          loadData();
          return;
        }
      } catch(e) {}
      document.getElementById('authOverlay').style.display = '';
      document.getElementById('authUsername').focus();
    }

    async function doAuth() {
      const username = document.getElementById('authUsername').value;
      const pw = document.getElementById('authPassword').value;
      if (!username || !pw) return;
      const btn = document.getElementById('authBtn');
      btn.textContent = '验证中...';
      btn.disabled = true;
      try {
        const res = await fetch('/api/leader/login', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({username, password: pw})
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('authOverlay').style.display = 'none';
          document.getElementById('mainContent').style.display = '';
          loadData();
          return;
        }
        document.getElementById('authError').style.display = '';
      } catch(e) {
        document.getElementById('authError').style.display = '';
      }
      btn.textContent = '进入';
      btn.disabled = false;
    }

    async function loadData() {
      try {
        const data = (await api('/api/leader/today')).data;
        document.getElementById('totalCount').textContent = data.total;
        document.getElementById('submittedCount').textContent = data.submitted;
        document.getElementById('notSubmittedCount').textContent = data.not_submitted;
        document.getElementById('fieldCount').textContent = data.in_field;

        // 未提交名单
        const missingCard = document.getElementById('missingCard');
        const missingList = document.getElementById('missingList');
        if (data.not_submitted_list && data.not_submitted_list.length > 0) {
          missingCard.style.display = 'block';
          missingList.innerHTML = data.not_submitted_list.map(e =>
            `<span class="tag" style="background:rgba(255,68,68,.15);color:var(--danger);margin:4px;display:inline-block">${e.name} (${e.abbr})</span>`
          ).join('');
        } else {
          missingCard.style.display = 'none';
        }

        // 工程师列表
        const container = document.getElementById('engineerList');
        container.innerHTML = data.engineers.map(e => {
          const statusDot = e.is_submitted
            ? `<span class="status-dot ${e.report.status}"></span> 已完成`
            : '<span class="status-dot" style="background:var(--danger)"></span> 未提交';

          const locationTag = e.in_field
            ? `<span class="tag tag-field">在外实施</span>`
            : (e.plan ? `<span class="tag ${e.plan.destination === 'back_to_office' ? 'tag-office' : 'tag-other'}">${e.plan.destination === 'back_to_office' ? '回公司' : '其他'}</span>` : '-');

          return `<div class="engineer-row">
            <span class="avatar">${e.abbr}</span>
            <div style="flex:1;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
              <strong>${e.name}</strong>
              ${!e.is_submitted ? '<span class="missing">未提交日报</span>' : ''}
              <span>${e.report ? `${e.report.project_name} | 进度 ${e.report.progress}%` : '-'}</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              ${e.is_submitted ? `<span class="status-dot ${e.report.status}"></span>` : ''}
              ${locationTag}
            </div>
          </div>`;
        }).join('');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // viewer 退出
    async function logout() {
      await fetch('/api/leader/logout', { method: 'POST' });
      window.location.reload();
    }

    checkAuth();
  </script>
</body>
</html>
