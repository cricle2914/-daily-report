<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出勤格子 - 领导看板</title>
  <link rel="stylesheet" href="leader.css">
  <style>
    .period-tabs { display:flex; gap:4px; margin-bottom:16px; }
    .period-tab {
      padding:6px 16px; border-radius:6px; border:1px solid var(--border);
      background:transparent; color:var(--text-secondary); font-size:13px;
      font-family:inherit; cursor:pointer; transition:all .15s; font-weight:500;
    }
    .period-tab:hover { border-color:var(--text-primary); color:var(--text-primary); }
    .period-tab.active { background:var(--text-primary); color:var(--bg); border-color:var(--text-primary); }

    .legend { display:flex; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
    .legend-item { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-secondary); }
    .legend-swatch { width:16px; height:16px; border-radius:3px; border:1px solid var(--border); }

    .filter-bar { display:flex; gap:12px; align-items:flex-end; margin-bottom:16px; flex-wrap:wrap; }
    .filter-bar .form-group { margin-bottom:0; }

    /* 网格容器 */
    #gridWrap { overflow-x:auto; }
    .eng-row {
      display:flex; align-items:stretch; gap:0;
      border-bottom:1px solid var(--border); min-height:44px;
    }
    .eng-row:last-child { border-bottom:none; }
    .eng-label {
      width:70px; flex-shrink:0; display:flex; align-items:center;
      font-size:12px; font-weight:600; padding:8px 12px 8px 0;
      position:sticky; left:0; z-index:2; background:var(--bg-card);
    }
    .eng-label .abbr {
      width:28px; height:28px; border-radius:6px; background:var(--text-primary);
      color:var(--bg); display:flex; align-items:center; justify-content:center;
      font-size:11px; font-weight:900; margin-right:6px; flex-shrink:0;
    }
    .eng-label .name { font-size:12px; white-space:nowrap; }

    /* 星期标签行 */
    .weekday-row {
      display:flex; align-items:stretch; gap:0;
      border-bottom:1px solid var(--border); height:24px;
    }
    .weekday-label {
      width:70px; flex-shrink:0; font-size:10px; color:var(--text-dim);
      padding:4px 12px 4px 0; text-align:right; position:sticky; left:0; z-index:2;
      background:var(--bg-card);
    }
    .weekday-cell {
      font-size:10px; color:var(--text-dim); display:flex; align-items:center;
      justify-content:center; border-right:1px solid transparent;
    }

    /* 月视图：日历格子 */
    .month-container { display:flex; gap:1px; align-items:stretch; flex:1; }
    .week-group { display:flex; gap:1px; margin-right:6px; }
    .week-group:last-child { margin-right:0; }
    .cal-cell {
      width:32px; height:32px; border-radius:3px; cursor:pointer;
      transition:opacity .15s; position:relative; flex-shrink:0;
    }
    .cal-cell:hover { opacity:.7; }
    .cal-cell.onsite { background:#44cc77; }
    .cal-cell.other { background:#ffaa00; }
    .cal-cell.weekend { background:rgba(255,255,255,.06); }
    .cal-cell.unknown { background:rgba(255,255,255,.03); }
    .cal-cell.empty { background:transparent; cursor:default; pointer-events:none; }

    /* 周视图：柱状图 */
    .week-container { display:flex; gap:2px; align-items:stretch; flex:1; padding:4px 0; }
    .week-bar-cell {
      flex:1; min-width:16px; max-width:40px; border-radius:4px 4px 0 0;
      cursor:pointer; transition:opacity .15s; position:relative;
      display:flex; align-items:flex-end;
    }
    .week-bar-cell .bar-fill {
      width:100%; border-radius:4px 4px 0 0; min-height:12px; transition:height .2s;
    }
    .week-bar-cell:hover .bar-fill { opacity:.7; }
    .week-bar-cell .bar-fill.onsite { background:#44cc77; }
    .week-bar-cell .bar-fill.other { background:#ffaa00; }
    .week-bar-cell .bar-fill.weekend { background:rgba(255,255,255,.06); }
    .week-bar-cell .bar-fill.unknown { background:rgba(255,255,255,.03); }

    /* 季度/年视图：紧凑格子 */
    .compact-wrap { display:flex; gap:0; flex:1; }
    .month-block { margin-right:8px; }
    .month-block:last-child { margin-right:0; }
    .month-title { font-size:9px; color:var(--text-dim); margin-bottom:2px; text-align:center; }
    .month-grid { display:grid; gap:1px; }
    .month-grid .cal-cell { width:12px; height:12px; border-radius:2px; }
    .month-grid.quarter .cal-cell { width:16px; height:16px; }
    .month-grid.year .cal-cell { width:8px; height:8px; border-radius:1px; }

    /* tooltip */
    .cal-cell::after, .bar-fill::after {
      content:attr(data-tip); position:fixed; bottom:auto;
      padding:4px 8px; border-radius:4px; background:#222; color:#fff;
      font-size:11px; white-space:nowrap; pointer-events:none; opacity:0;
      transition:opacity .12s; z-index:999; border:1px solid #444;
      transform:translateY(-100%);
    }
    .cal-cell:hover::after, .bar-fill:hover::after { opacity:1; }

    .empty-state { text-align:center; padding:60px 20px; color:var(--text-secondary); font-size:14px; }

    /* 容器卡片 */
    .card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; }
  </style>
</head>
<body>
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-title">领导看板</div>
      <div class="sidebar-nav">
        <a class="nav-item" href="index.html">📋 今日汇报</a>
        <a class="nav-item active" href="attendance.html">📅 出勤格子</a>
        <a class="nav-item" href="stats.html">📊 工时统计</a>
      </div>
      <div style="padding:12px 20px;border-top:1px solid var(--border)">
        <a class="nav-item" href="/admin/" style="padding:8px 0">⚙ 管理后台</a>
      </div>
    </div>
    <div class="main">
      <div class="topbar">
        <span class="topbar-user" id="topbarUser"></span>
        <span class="topbar-user" id="topbarRole"></span>
        <button class="topbar-btn" onclick="logout()">退出</button>
      </div>

      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap">
        <div class="page-title" style="margin-bottom:0">出勤格子</div>
        <span id="navLabel" style="font-size:13px;color:var(--text-secondary)"></span>
      </div>

      <div class="filter-bar">
        <div class="period-tabs" id="periodTabs">
          <button class="period-tab" data-period="week">周</button>
          <button class="period-tab active" data-period="month">月</button>
          <button class="period-tab" data-period="quarter">季度</button>
          <button class="period-tab" data-period="year">年</button>
        </div>
        <div class="form-group">
          <select class="form-select" id="filterEngineer">
            <option value="">全部工程师</option>
          </select>
        </div>
        <div style="display:flex;gap:4px">
          <button class="btn btn-secondary btn-sm" id="prevBtn">‹ 上期</button>
          <button class="btn btn-secondary btn-sm" id="nextBtn">下期 ›</button>
          <button class="btn btn-secondary btn-sm" id="todayBtn">今天</button>
        </div>
      </div>

      <div class="legend">
        <div class="legend-item"><div class="legend-swatch" style="background:#44cc77"></div>出勤</div>
        <div class="legend-item"><div class="legend-swatch" style="background:#ffaa00"></div>请假</div>
        <div class="legend-item"><div class="legend-swatch" style="background:rgba(255,255,255,.06)"></div>周末</div>
        <div class="legend-item"><div class="legend-swatch" style="background:rgba(255,255,255,.03)"></div>无记录</div>
      </div>

      <div class="card" id="gridWrap">
        <div class="empty-state">加载中...</div>
      </div>
    </div>
  </div>
  <script src="/admin/admin.js"></script>
  <script>
    let currentDate = new Date();
    let currentPeriod = 'month';
    let attendanceData = null;
    let allEngineers = [];

    const WEEKDAYS_CN = ['一', '二', '三', '四', '五', '六', '日'];

    function formatDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function getDateRange(period, date) {
      const d = new Date(date);
      let from, to;
      switch (period) {
        case 'year':
          from = `${d.getFullYear()}-01-01`;
          to = `${d.getFullYear()}-12-31`;
          break;
        case 'quarter': {
          const q = Math.floor(d.getMonth() / 3) * 3;
          from = formatDate(new Date(d.getFullYear(), q, 1));
          to = formatDate(new Date(d.getFullYear(), q + 3, 0));
          break;
        }
        case 'month':
          from = formatDate(new Date(d.getFullYear(), d.getMonth(), 1));
          to = formatDate(new Date(d.getFullYear(), d.getMonth() + 1, 0));
          break;
        case 'week': {
          const dow = d.getDay();
          const monday = new Date(d);
          monday.setDate(d.getDate() - (dow === 0 ? 6 : dow - 1));
          const sunday = new Date(monday);
          sunday.setDate(monday.getDate() + 6);
          from = formatDate(monday);
          to = formatDate(sunday);
          break;
        }
      }
      return { from, to };
    }

    function getPeriodLabel(period, date) {
      const d = new Date(date);
      const y = d.getFullYear();
      switch (period) {
        case 'year': return `${y}年`;
        case 'quarter': return `${y}年 Q${Math.floor(d.getMonth() / 3) + 1}`;
        case 'month': return `${y}年${d.getMonth() + 1}月`;
        case 'week': {
          const range = getDateRange('week', d);
          return `${range.from} ~ ${range.to}`;
        }
      }
    }

    function navigate(delta) {
      const d = new Date(currentDate);
      switch (currentPeriod) {
        case 'year': d.setFullYear(d.getFullYear() + delta); break;
        case 'quarter': d.setMonth(d.getMonth() + delta * 3); break;
        case 'month': d.setMonth(d.getMonth() + delta); break;
        case 'week': d.setDate(d.getDate() + delta * 7); break;
      }
      currentDate = d;
      loadAttendance();
    }

    function goToToday() {
      currentDate = new Date();
      loadAttendance();
    }

    async function loadEngineers() {
      try {
        const data = (await api('/api/leader/today')).data;
        allEngineers = data.engineers || [];
        const sel = document.getElementById('filterEngineer');
        sel.innerHTML = '<option value="">全部工程师</option>';
        allEngineers.forEach(e => {
          sel.innerHTML += `<option value="${e.id}">${e.name}</option>`;
        });
      } catch (err) {}
    }

    async function loadAttendance() {
      const range = getDateRange(currentPeriod, currentDate);
      document.getElementById('navLabel').textContent = getPeriodLabel(currentPeriod, currentDate);

      const engineerId = document.getElementById('filterEngineer').value;

      try {
        const params = new URLSearchParams({ date_from: range.from, date_to: range.to });
        if (engineerId) params.set('engineer_id', engineerId);

        const res = await fetch(`/api/leader/attendance?${params.toString()}`);
        const json = await res.json();
        if (!json.success) throw new Error(json.message);
        attendanceData = json.data;

        renderGrid(attendanceData);
      } catch (err) {
        document.getElementById('gridWrap').innerHTML = `<div class="empty-state">加载失败：${err.message}</div>`;
      }
    }

    // ====== 渲染逻辑 ======

    function renderGrid(data) {
      const { engineers, dates, attendance } = data;
      if (!engineers || engineers.length === 0) {
        document.getElementById('gridWrap').innerHTML = '<div class="empty-state">暂无数据</div>';
        return;
      }

      const container = document.getElementById('gridWrap');
      let html = '<div class="eng-row weekday-row"><div class="weekday-label"></div>';

      if (currentPeriod === 'week') {
        // 周视图：7天柱状图
        html += '<div class="week-container">';
        dates.forEach((d, idx) => {
          html += `<div class="weekday-cell" style="flex:1;min-width:16px;max-width:40px">${WEEKDAYS_CN[idx]}</div>`;
        });
        html += '</div></div>';

        engineers.forEach(e => {
          const engAtt = attendance[e.id] || {};
          const maxReport = Math.max(1, ...dates.map(d => (engAtt[d] && engAtt[d].has_report) ? 1 : 0));

          html += `<div class="eng-row"><div class="eng-label">
            <span class="abbr">${e.abbr}</span><span class="name">${e.name}</span>
          </div><div class="week-container">`;

          dates.forEach(d => {
            const cell = engAtt[d] || { color: 'unknown', report_id: null };
            const isWork = cell.color === 'onsite';
            const barH = isWork ? 32 : 12;
            html += `<div class="week-bar-cell">
              <div class="bar-fill ${cell.color}" style="height:${barH}px" data-tip="${d}"
                ${cell.report_id ? `onclick="window.open('/admin/report-edit.html?id=${cell.report_id}','_blank')"` : ''}></div>
            </div>`;
          });

          html += '</div></div>';
        });

      } else if (currentPeriod === 'month') {
        // 月视图：日历点阵
        // 计算每周分组
        const firstDate = new Date(dates[0]);
        const year = firstDate.getFullYear();
        const month = firstDate.getMonth();
        const firstDayOfMonth = new Date(year, month, 1);
        const lastDayOfMonth = new Date(year, month + 1, 0);
        // 当月第一天是星期几（0=日, 1=月, ...）
        let startDow = firstDayOfMonth.getDay();
        // 转为周一=0
        startDow = startDow === 0 ? 6 : startDow - 1;

        const totalDays = lastDayOfMonth.getDate();
        const weeks = [];
        let week = [];
        // 月首空白
        for (let i = 0; i < startDow; i++) week.push(null);
        for (let day = 1; day <= totalDays; day++) {
          const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          week.push(dateStr);
          if (week.length === 7) {
            weeks.push(week);
            week = [];
          }
        }
        if (week.length > 0) {
          // 月末空白补齐
          while (week.length < 7) week.push(null);
          weeks.push(week);
        }

        html += '</div>';

        engineers.forEach(e => {
          const engAtt = attendance[e.id] || {};
          html += `<div class="eng-row"><div class="eng-label">
            <span class="abbr">${e.abbr}</span><span class="name">${e.name}</span>
          </div><div class="month-container">`;

          weeks.forEach(week => {
            html += '<div class="week-group">';
            week.forEach(dateStr => {
              if (dateStr) {
                const cell = engAtt[dateStr] || { color: 'unknown', report_id: null };
                html += `<div class="cal-cell ${cell.color}" data-tip="${dateStr}"
                  ${cell.report_id ? `onclick="window.open('/admin/report-edit.html?id=${cell.report_id}','_blank')"` : ''}></div>`;
              } else {
                html += '<div class="cal-cell empty"></div>';
              }
            });
            html += '</div>';
          });

          html += '</div></div>';
        });

      } else {
        // 关闭初始 weekday-row
        html += '</div>';
        // 季度/年视图：紧凑日历
        const isYear = currentPeriod === 'year';
        const cellClass = isYear ? 'year' : 'quarter';

        // 按月份分组日期
        const monthMap = {};
        dates.forEach(d => {
          const m = d.slice(0, 7); // YYYY-MM
          if (!monthMap[m]) monthMap[m] = [];
          monthMap[m].push(d);
        });

        const monthKeys = Object.keys(monthMap);

        engineers.forEach(e => {
          const engAtt = attendance[e.id] || {};
          html += `<div class="eng-row"><div class="eng-label">
            <span class="abbr">${e.abbr}</span><span class="name">${e.name}</span>
          </div><div class="compact-wrap">`;

          monthKeys.forEach(mKey => {
            const monthDates = monthMap[mKey];
            const [y, m] = mKey.split('-').map(Number);
            const firstDay = new Date(y, m - 1, 1);
            let startDow = firstDay.getDay();
            startDow = startDow === 0 ? 6 : startDow - 1;

            // 计算该月天数
            const lastDay = new Date(y, m, 0).getDate();
            const cells = [];
            for (let i = 0; i < startDow; i++) cells.push(null);
            for (let day = 1; day <= lastDay; day++) {
              cells.push(`${mKey}-${String(day).padStart(2, '0')}`);
            }
            // 补齐到7的倍数以形成完整网格
            while (cells.length % 7 !== 0) cells.push(null);

            html += `<div class="month-block"><div class="month-title">${m}月</div><div class="month-grid ${cellClass}" style="grid-template-columns:repeat(7,1fr)">`;
            cells.forEach(dateStr => {
              if (dateStr) {
                const cell = engAtt[dateStr] || { color: 'unknown', report_id: null };
                html += `<div class="cal-cell ${cell.color}" data-tip="${dateStr}"
                  ${cell.report_id ? `onclick="window.open('/admin/report-edit.html?id=${cell.report_id}','_blank')"` : ''}></div>`;
              } else {
                html += '<div class="cal-cell empty"></div>';
              }
            });
            html += '</div></div>';
          });

          html += '</div></div>';
        });
      }

      container.innerHTML = html;
    }

    // ====== 事件绑定 ======

    document.querySelectorAll('.period-tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.period-tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        currentPeriod = this.dataset.period;
        currentDate = new Date();
        loadAttendance();
      });
    });

    document.getElementById('prevBtn').addEventListener('click', () => navigate(-1));
    document.getElementById('nextBtn').addEventListener('click', () => navigate(1));
    document.getElementById('todayBtn').addEventListener('click', goToToday);
    document.getElementById('filterEngineer').addEventListener('change', loadAttendance);

    document.addEventListener('DOMContentLoaded', () => {
      // 覆写 leader 导航高亮
      const currentPage = window.location.pathname.replace('/leader/', '').split('?')[0] || 'index.html';
      document.querySelectorAll('.nav-item').forEach(item => {
        const href = item.getAttribute('href');
        if (href === currentPage) item.classList.add('active');
      });
      loadEngineers();
      loadAttendance();
    });
  </script>
</body>
</html>
