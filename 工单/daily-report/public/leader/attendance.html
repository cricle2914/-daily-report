<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出勤格子 - 领导看板</title>
  <link rel="stylesheet" href="leader.css">
  <style>
    .period-tabs { display:flex; gap:4px; margin-bottom:16px; }
    .period-tab {
      padding:6px 16px; border-radius:6px; border:1px solid var(--border);
      background:transparent; color:var(--text-secondary); font-size:13px;
      font-family:inherit; cursor:pointer; transition:all .15s; font-weight:500;
    }
    .period-tab:hover { border-color:var(--text-primary); color:var(--text-primary); }
    .period-tab.active { background:var(--text-primary); color:var(--bg); border-color:var(--text-primary); }

    .legend { display:flex; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
    .legend-item { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-secondary); }
    .legend-swatch { width:16px; height:16px; border-radius:3px; border:1px solid var(--border); }

    .filter-bar { display:flex; gap:12px; align-items:flex-end; margin-bottom:16px; flex-wrap:wrap; }
    .filter-bar .form-group { margin-bottom:0; }

    .card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; }

    /* ===== 工程师行 ===== */
    .eng-row {
      display:flex; align-items:center; gap:6px;
      padding:5px 0; border-bottom:1px solid var(--border); min-height:36px;
    }
    .eng-row:last-child { border-bottom:none; }
    .eng-label {
      width:76px; flex-shrink:0; display:flex; align-items:center; gap:4px;
      font-size:12px; font-weight:600;
    }
    .eng-label .abbr {
      width:24px; height:24px; border-radius:5px; background:var(--text-primary);
      color:var(--bg); display:flex; align-items:center; justify-content:center;
      font-size:10px; font-weight:900; flex-shrink:0;
    }
    .eng-label .name { font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    /* ===== 通用格子 ===== */
    .cal-cell {
      border-radius:3px; cursor:pointer; transition:opacity .15s;
      position:relative;
    }
    .cal-cell:hover { opacity:.7; }
    .cal-cell.onsite { background:#44cc77; }
    .cal-cell.office { background:#4f8ef7; }
    .cal-cell.other { background:#ffaa00; }
    .cal-cell.weekend { background:rgba(255,255,255,.06); }
    .cal-cell.unknown { background:rgba(255,255,255,.03); }
    .cal-cell.empty { background:transparent; cursor:default; pointer-events:none; }

    /* ===== tooltip ===== */
    .cal-cell::after {
      content:attr(data-tip); position:fixed;
      padding:4px 8px; border-radius:4px; background:#222; color:#fff;
      font-size:11px; white-space:nowrap; pointer-events:none; opacity:0;
      transition:opacity .12s; z-index:999; border:1px solid #444;
      transform:translateY(-100%);
    }
    .cal-cell:hover::after { opacity:1; }

    .empty-state { text-align:center; padding:60px 20px; color:var(--text-secondary); font-size:14px; }

    /* ==================================================
       周视图：柱状图
       ================================================== */
    .week-bars { display:flex; gap:3px; flex:1; align-items:flex-end; height:72px; }
    .bar-cell {
      flex:1; display:flex; flex-direction:column; align-items:center;
      justify-content:flex-end; cursor:pointer;
    }
    .bar-cell .bar-fill {
      width:100%; border-radius:4px 4px 0 0; min-height:8px; transition:height .2s;
    }
    .bar-cell:hover .bar-fill { opacity:.7; }
    .bar-fill.onsite { background:#44cc77; }
    .bar-fill.office { background:#4f8ef7; }
    .bar-fill.other { background:#ffaa00; }
    .bar-fill.weekend { background:rgba(255,255,255,.06); }
    .bar-fill.unknown { background:rgba(255,255,255,.03); }
    .bar-fill::after {
      content:attr(data-tip); position:fixed;
      padding:4px 8px; border-radius:4px; background:#222; color:#fff;
      font-size:11px; white-space:nowrap; pointer-events:none; opacity:0;
      transition:opacity .12s; z-index:999; border:1px solid #444;
      transform:translateY(-100%);
    }
    .bar-fill:hover::after { opacity:1; }
    .week-header { display:flex; gap:3px; flex:1; margin-bottom:2px; }
    .week-header .dow-label { flex:1; text-align:center; font-size:11px; color:var(--text-secondary); font-weight:500; }

    /* ==================================================
       月视图：日历网格
       ================================================== */
    .month-grid {
      flex:1; display:grid; grid-template-columns:repeat(7,1fr); gap:2px;
    }
    .month-grid .cal-cell { aspect-ratio:1; min-height:20px; }
    .dow-header {
      display:flex; gap:2px; flex:1; margin-bottom:2px;
    }
    .dow-header span {
      flex:1; text-align:center; font-size:10px; color:var(--text-dim);
      padding:2px 0;
    }

    /* ==================================================
       季度/年视图：紧凑月历
       ================================================== */
    .compact-months { display:flex; gap:12px; flex:1; flex-wrap:nowrap; }
    .compact-months .month-block { flex:1; min-width:0; }
    .compact-months .month-title { font-size:12px; font-weight:700; color:var(--text-primary); margin-bottom:4px; text-align:center; }
    .compact-months .month-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
    .compact-months .month-grid .cal-cell { aspect-ratio:1; min-height:18px; border-radius:2px; }
    .compact-months.year-view { flex-wrap:wrap; }
    .compact-months.year-view .month-block { flex:0 0 calc(100% / 6); }
    .compact-months.year-view .month-grid .cal-cell { min-height:12px; }
  </style>
</head>
<body>
  <!-- 认证遮罩 -->
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-box">
      <h2>统计面板</h2>
      <p>请输入账户密码</p>
      <div class="error" id="authError">用户名或密码错误</div>
      <input class="form-input" id="authUsername" type="text" placeholder="用户名"
        style="margin-bottom:8px" autofocus>
      <input class="form-input" id="authPassword" type="password" placeholder="密码"
        onkeydown="if(event.key==='Enter')doAuth()">
      <button class="btn btn-primary" id="authBtn" onclick="doAuth()">进入</button>
    </div>
  </div>

  <div class="layout" id="mainContent" style="display:none">
    <div class="sidebar">
      <div class="sidebar-title">统计面板</div>
      <div class="sidebar-nav">
        <a class="nav-item" href="index.html">今日概览</a>
        <a class="nav-item active" href="attendance.html">出勤格子</a>
        <a class="nav-item" href="stats.html">工时统计</a>
      </div>
      <div style="padding:12px 20px;border-top:1px solid var(--border)">
        <span style="font-size:11px;color:var(--text-dim)">统计面板 v1.0</span>
      </div>
    </div>
    <div class="main">
      <div class="topbar">
        <span class="topbar-user" id="topbarUser"></span>
        <span class="topbar-user" id="topbarRole"></span>
        <button class="topbar-btn" onclick="logout()">退出</button>
      </div>

      <div class="page-title" style="font-size:26px;font-weight:800;margin-bottom:20px">出勤格子</div>

      <!-- 工具栏：工程师选择（左） 周期切换（中） 图例（右） -->
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:12px;flex-wrap:wrap">
        <div class="form-group" style="margin-bottom:0;min-width:160px">
          <select class="form-select" id="filterEngineer" style="font-size:14px;padding:8px 12px">
            <option value="">全部工程师</option>
          </select>
        </div>
        <div class="period-tabs" id="periodTabs" style="flex:1;justify-content:center;margin-bottom:0">
          <button class="period-tab active" data-period="week">周</button>
          <button class="period-tab" data-period="quarter">季度</button>
          <button class="period-tab" data-period="year">年</button>
        </div>
        <div class="legend" style="margin-bottom:0;justify-content:flex-end">
          <div class="legend-item"><div class="legend-swatch" style="background:#44cc77"></div>在外实施</div>
          <div class="legend-item"><div class="legend-swatch" style="background:#4f8ef7"></div>在公司</div>
          <div class="legend-item"><div class="legend-swatch" style="background:#ffaa00"></div>请假</div>
          <div class="legend-item"><div class="legend-swatch" style="background:rgba(255,255,255,.06)"></div>周末</div>
          <div class="legend-item"><div class="legend-swatch" style="background:rgba(255,255,255,.03)"></div>无记录</div>
        </div>
      </div>

      <!-- 导航区域：上期/下期（工程师选择下方） -->
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
        <button class="btn btn-secondary" id="prevBtn" style="font-size:14px;padding:8px 20px">‹ 上期</button>
        <button class="btn btn-secondary" id="nextBtn" style="font-size:14px;padding:8px 20px">下期 ›</button>
        <span id="navLabel" style="font-size:15px;color:var(--text-secondary);margin-left:12px;font-weight:600"></span>
      </div>

      <div class="card" id="gridWrap">
        <div class="empty-state">加载中...</div>
      </div>
    </div>
  </div>
  <script src="/admin/admin.js"></script>
  <script>
    let currentDate = new Date();
    let currentPeriod = 'week';
    let attendanceData = null;
    let allEngineers = [];

    const WEEKDAY_NAMES = ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'];
    const WEEKDAYS_CN = ['一', '二', '三', '四', '五', '六', '日'];

    function formatDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function getDateRange(period, date) {
      const d = new Date(date);
      let from, to;
      switch (period) {
        case 'year':
          from = `${d.getFullYear()}-01-01`;
          to = `${d.getFullYear()}-12-31`;
          break;
        case 'quarter': {
          const q = Math.floor(d.getMonth() / 3) * 3;
          from = formatDate(new Date(d.getFullYear(), q, 1));
          to = formatDate(new Date(d.getFullYear(), q + 3, 0));
          break;
        }
        case 'month':
          from = formatDate(new Date(d.getFullYear(), d.getMonth(), 1));
          to = formatDate(new Date(d.getFullYear(), d.getMonth() + 1, 0));
          break;
        case 'week': {
          const dow = d.getDay();
          const monday = new Date(d);
          monday.setDate(d.getDate() - (dow === 0 ? 6 : dow - 1));
          const sunday = new Date(monday);
          sunday.setDate(monday.getDate() + 6);
          from = formatDate(monday);
          to = formatDate(sunday);
          break;
        }
      }
      return { from, to };
    }

    function getPeriodLabel(period, date) {
      const d = new Date(date);
      const y = d.getFullYear();
      switch (period) {
        case 'year': return `${y}年`;
        case 'quarter': return `${y}年 Q${Math.floor(d.getMonth() / 3) + 1}`;
        case 'month': return `${y}年${d.getMonth() + 1}月`;
        case 'week': {
          const range = getDateRange('week', d);
          return `${range.from} ~ ${range.to}`;
        }
      }
    }

    function navigate(delta) {
      const d = new Date(currentDate);
      switch (currentPeriod) {
        case 'year': d.setFullYear(d.getFullYear() + delta); break;
        case 'quarter': d.setMonth(d.getMonth() + delta * 3); break;
        case 'month': d.setMonth(d.getMonth() + delta); break;
        case 'week': d.setDate(d.getDate() + delta * 7); break;
      }
      currentDate = d;
      loadAttendance();
    }

    async function loadEngineers() {
      try {
        const data = (await api('/api/leader/today')).data;
        allEngineers = data.engineers || [];
        const sel = document.getElementById('filterEngineer');
        sel.innerHTML = '<option value="">全部工程师</option>';
        allEngineers.forEach(e => {
          sel.innerHTML += `<option value="${e.id}">${e.name}</option>`;
        });
      } catch (err) {}
    }

    async function loadAttendance() {
      const range = getDateRange(currentPeriod, currentDate);
      document.getElementById('navLabel').textContent = getPeriodLabel(currentPeriod, currentDate);
      const engineerId = document.getElementById('filterEngineer').value;
      try {
        const params = new URLSearchParams({ date_from: range.from, date_to: range.to });
        if (engineerId) params.set('engineer_id', engineerId);
        const res = await fetch(`/api/leader/attendance?${params.toString()}`);
        const json = await res.json();
        if (!json.success) throw new Error(json.message);
        attendanceData = json.data;
        renderGrid(attendanceData);
      } catch (err) {
        document.getElementById('gridWrap').innerHTML = `<div class="empty-state">加载失败：${err.message}</div>`;
      }
    }

    // ====== 渲染 ======

    function renderGrid(data) {
      const { engineers, dates, attendance } = data;
      if (!engineers || engineers.length === 0) {
        document.getElementById('gridWrap').innerHTML = '<div class="empty-state">暂无数据</div>';
        return;
      }
      const container = document.getElementById('gridWrap');

      if (currentPeriod === 'week') {
        renderWeek(container, engineers, dates, attendance);
      } else if (currentPeriod === 'month') {
        renderMonth(container, engineers, dates, attendance);
      } else {
        renderCompact(container, engineers, dates, attendance);
      }
    }

    // ---- 周（柱状图） ----
    function renderWeek(container, engineers, dates, attendance) {
      let html = `<div class="eng-row"><div class="eng-label"></div><div class="week-header">`;
      dates.forEach((d, idx) => {
        html += `<div class="dow-label">${WEEKDAY_NAMES[idx]}</div>`;
      });
      html += '</div></div>';

      engineers.forEach(e => {
        const engAtt = attendance[e.id] || {};
        html += `<div class="eng-row"><div class="eng-label">
          <span class="abbr">${e.abbr}</span><span class="name">${e.name}</span>
        </div><div class="week-bars">`;
        dates.forEach(d => {
          const cell = engAtt[d] || { color: 'unknown', report_id: null };
          const isWork = cell.color === 'onsite' || cell.color === 'office';
          const barH = isWork ? 60 : 10;
          html += `<div class="bar-cell">
            <div class="bar-fill ${cell.color}" style="height:${barH}px" data-tip="${d}"
              ${cell.report_id ? `onclick="window.open('/admin/report-edit.html?id=${cell.report_id}','_blank')"` : ''}></div>
          </div>`;
        });
        html += '</div></div>';
      });
      container.innerHTML = html;
    }

    // ---- 月（日历网格） ----
    function renderMonth(container, engineers, dates, attendance) {
      const firstDate = new Date(dates[0]);
      const year = firstDate.getFullYear();
      const month = firstDate.getMonth();
      let startDow = new Date(year, month, 1).getDay();
      startDow = startDow === 0 ? 6 : startDow - 1;
      const totalDays = new Date(year, month + 1, 0).getDate();

      const cells = [];
      for (let i = 0; i < startDow; i++) cells.push(null);
      for (let day = 1; day <= totalDays; day++) {
        cells.push(`${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`);
      }

      let html = `<div class="eng-row"><div class="eng-label"></div><div class="dow-header">`;
      WEEKDAYS_CN.forEach(w => html += `<span>${w}</span>`);
      html += '</div></div>';

      engineers.forEach(e => {
        const engAtt = attendance[e.id] || {};
        html += `<div class="eng-row"><div class="eng-label">
          <span class="abbr">${e.abbr}</span><span class="name">${e.name}</span>
        </div><div class="month-grid">`;
        cells.forEach(dateStr => {
          if (dateStr) {
            const cell = engAtt[dateStr] || { color: 'unknown', report_id: null };
            html += `<div class="cal-cell ${cell.color}" data-tip="${dateStr}"
              ${cell.report_id ? `onclick="window.open('/admin/report-edit.html?id=${cell.report_id}','_blank')"` : ''}></div>`;
          } else {
            html += '<div class="cal-cell empty"></div>';
          }
        });
        html += '</div></div>';
      });
      container.innerHTML = html;
    }

    // ---- 季度/年（紧凑月历） ----
    function renderCompact(container, engineers, dates, attendance) {
      const isYear = currentPeriod === 'year';

      const monthMap = {};
      dates.forEach(d => {
        const m = d.slice(0, 7);
        if (!monthMap[m]) monthMap[m] = [];
        monthMap[m].push(d);
      });
      const monthKeys = Object.keys(monthMap);

      let html = '';
      engineers.forEach(e => {
        const engAtt = attendance[e.id] || {};
        html += `<div class="eng-row"><div class="eng-label">
          <span class="abbr">${e.abbr}</span><span class="name">${e.name}</span>
        </div><div class="compact-months ${isYear ? 'year-view' : ''}">`;

        monthKeys.forEach(mKey => {
          const [y, m] = mKey.split('-').map(Number);
          let startDow = new Date(y, m - 1, 1).getDay();
          startDow = startDow === 0 ? 6 : startDow - 1;
          const lastDay = new Date(y, m, 0).getDate();

          const cells = [];
          for (let i = 0; i < startDow; i++) cells.push(null);
          for (let day = 1; day <= lastDay; day++) {
            cells.push(`${mKey}-${String(day).padStart(2, '0')}`);
          }

          html += `<div class="month-block"><div class="month-title">${m}月</div><div class="month-grid">`;
          cells.forEach(dateStr => {
            if (dateStr) {
              const cell = engAtt[dateStr] || { color: 'unknown', report_id: null };
              html += `<div class="cal-cell ${cell.color}" data-tip="${dateStr}"
                ${cell.report_id ? `onclick="window.open('/admin/report-edit.html?id=${cell.report_id}','_blank')"` : ''}></div>`;
            } else {
              html += '<div class="cal-cell empty"></div>';
            }
          });
          html += '</div></div>';
        });

        html += '</div></div>';
      });
      container.innerHTML = html;
    }

    // ====== 事件绑定 ======

    document.querySelectorAll('.period-tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.period-tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        currentPeriod = this.dataset.period;
        currentDate = new Date();
        loadAttendance();
      });
    });

    document.getElementById('prevBtn').addEventListener('click', () => navigate(-1));
    document.getElementById('nextBtn').addEventListener('click', () => navigate(1));
    document.getElementById('filterEngineer').addEventListener('change', loadAttendance);

    // ====== viewer 认证 ======
    async function checkAuth() {
      try {
        const res = await fetch('/api/leader/me');
        const data = await res.json();
        if (data.success) {
          document.getElementById('authOverlay').style.display = 'none';
          document.getElementById('mainContent').style.display = '';
          if (data.data.role) {
            document.getElementById('topbarRole').textContent = data.data.role === 'viewer' ? '查看者' : '管理员';
          }
          const currentPage = window.location.pathname.replace('/leader/', '').split('?')[0] || 'index.html';
          document.querySelectorAll('.nav-item').forEach(item => {
            const href = item.getAttribute('href');
            if (href === currentPage) item.classList.add('active');
          });
          loadEngineers();
          loadAttendance();
          return;
        }
      } catch(e) {}
      document.getElementById('authOverlay').style.display = '';
      document.getElementById('authUsername').focus();
    }

    async function doAuth() {
      const username = document.getElementById('authUsername').value;
      const pw = document.getElementById('authPassword').value;
      if (!username || !pw) return;
      const btn = document.getElementById('authBtn');
      btn.textContent = '验证中...';
      btn.disabled = true;
      try {
        const res = await fetch('/api/leader/login', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({username, password: pw})
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('authOverlay').style.display = 'none';
          document.getElementById('mainContent').style.display = '';
          const currentPage = window.location.pathname.replace('/leader/', '').split('?')[0] || 'index.html';
          document.querySelectorAll('.nav-item').forEach(item => {
            const href = item.getAttribute('href');
            if (href === currentPage) item.classList.add('active');
          });
          loadEngineers();
          loadAttendance();
          return;
        }
        document.getElementById('authError').style.display = '';
      } catch(e) {
        document.getElementById('authError').style.display = '';
      }
      btn.textContent = '进入';
      btn.disabled = false;
    }

    // viewer 退出
    async function logout() {
      await fetch('/api/leader/logout', { method: 'POST' });
      window.location.reload();
    }

    document.addEventListener('DOMContentLoaded', checkAuth);
  </script>
</body>
</html>
