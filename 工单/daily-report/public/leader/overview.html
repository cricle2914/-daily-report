<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日报概览 - 统计面板</title>
  <link rel="stylesheet" href="leader.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { overflow: hidden; }
    .sq-36 { width:36px; height:36px; border-radius:4px; transition:all .12s; cursor:pointer; }
    .sq-36:hover { transform:scale(1.12); opacity:.85; }
    .tooltip-el { position:fixed; pointer-events:none; z-index:9999; padding:5px 10px; border-radius:6px; font-size:12px; background:#1a1a1a; color:#fff; border:1px solid #333; white-space:nowrap; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    @keyframes slideUp { from{opacity:0;transform:translateY(20px) scale(.96)} to{opacity:1;transform:translateY(0) scale(1)} }
    .modal-overlay { animation:fadeIn .15s ease-out; }
    .modal-content { animation:slideUp .2s ease-out; }
    .eng-row { transition:background .12s; cursor:pointer; }
    .eng-row:hover { background:rgba(255,255,255,.04); }
    .legend-sq { width:10px; height:10px; border-radius:2px; display:inline-block; flex-shrink:0; }
    .list-scroll::-webkit-scrollbar { width:3px; }
    .list-scroll::-webkit-scrollbar-thumb { background:#333; border-radius:2px; }
    .list-scroll::-webkit-scrollbar-track { background:transparent; }
  </style>
</head>
<body>
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-box">
      <h2>统计面板</h2>
      <p>请输入账户密码</p>
      <div class="error" id="authError">用户名或密码错误</div>
      <input class="form-input" id="authUsername" type="text" placeholder="用户名" autofocus>
      <input class="form-input" id="authPassword" type="password" placeholder="密码"
        onkeydown="if(event.key==='Enter')doAuth()">
      <button class="btn btn-primary" id="authBtn" onclick="doAuth()">进入</button>
    </div>
  </div>

  <div class="layout" id="mainContent" style="display:none">
    <div class="sidebar">
      <div class="sidebar-title">统计面板</div>
      <div class="sidebar-nav">
        <a class="nav-item active" href="overview.html">日报概览</a>
        <a class="nav-item" href="attendance.html">出勤格子</a>
        <a class="nav-item" href="engineer.html">工程师概况</a>
        <a class="nav-item" href="stats.html">工时统计</a>
      </div>
      <div style="padding:12px 20px;border-top:1px solid var(--border)">
        <span style="font-size:11px;color:var(--text-dim)">统计面板 v1.0</span>
      </div>
    </div>
    <div class="main" style="display:flex; flex-direction:column;">
      <div class="topbar">
        <span class="topbar-user" id="topbarUser"></span>
        <span class="topbar-user" id="topbarRole"></span>
        <button class="topbar-btn" onclick="logout()">退出</button>
      </div>
      <div id="root" style="flex:1; min-height:0;"></div>
    </div>
  </div>

  <script src="/admin/admin.js"></script>
  <script>
    async function checkAuth() {
      try {
        const res = await fetch('/api/leader/me');
        const data = await res.json();
        if (data.success) {
          document.getElementById('authOverlay').style.display = 'none';
          document.getElementById('mainContent').style.display = '';
          if (data.data && data.data.role) {
            document.getElementById('topbarRole').textContent = data.data.role === 'viewer' ? '查看者' : '管理员';
          }
          document.dispatchEvent(new Event('authReady'));
          return;
        }
      } catch (e) {}
      document.getElementById('authOverlay').style.display = '';
      document.getElementById('authUsername').focus();
    }
    async function doAuth() {
      const username = document.getElementById('authUsername').value;
      const pw = document.getElementById('authPassword').value;
      if (!username || !pw) return;
      const btn = document.getElementById('authBtn');
      btn.textContent = '验证中...'; btn.disabled = true;
      try {
        const res = await fetch('/api/leader/login', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({username, password: pw})
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('authOverlay').style.display = 'none';
          document.getElementById('mainContent').style.display = '';
          document.dispatchEvent(new Event('authReady'));
          return;
        }
        document.getElementById('authError').style.display = '';
      } catch(e) { document.getElementById('authError').style.display = ''; }
      btn.textContent = '进入'; btn.disabled = false;
    }
    async function logout() {
      await fetch('/api/leader/logout', { method:'POST' });
      window.location.reload();
    }
    document.addEventListener('DOMContentLoaded', checkAuth);
  </script>
  <script type="text/babel">
    const { useState, useCallback, useRef, useEffect } = React;

    const TOMORROW = {
      in_project:'有项目在外', back_to_office:'在公司', unavailable:'请假',
    };
    const SQ = 36, GAP = 6;

    const MOCK = [
      { id:1,  name:'王涛',   abbr:'王', project:'清科管理·AnyShare部署', progress:75, submitted:true,  tomorrowStatus:'in_project',     tomorrowTarget:'清科管理·AnyShare部署' },
      { id:2,  name:'张宏洋', abbr:'张', project:'某银行核心系统升级',   progress:100, submitted:true,  tomorrowStatus:'back_to_office' },
      { id:3,  name:'周继成', abbr:'周', project:'数据中心网络迁移',     progress:45,  submitted:false, tomorrowStatus:'in_project',     tomorrowTarget:'数据中心网络迁移' },
      { id:4,  name:'张学龙', abbr:'学', project:'医院HIS系统对接',      progress:60,  submitted:true,  tomorrowStatus:'back_to_office' },
      { id:5,  name:'李明',   abbr:'李', project:'政务云平台部署',       progress:90,  submitted:false, tomorrowStatus:'unavailable' },
      { id:6,  name:'赵强',   abbr:'赵', project:'ERP系统调试优化',      progress:30,  submitted:true,  tomorrowStatus:'in_project',     tomorrowTarget:'ERP系统调试优化' },
      { id:7,  name:'刘洋',   abbr:'刘', project:'网络安全加固方案',     progress:80,  submitted:true,  tomorrowStatus:'in_project',     tomorrowTarget:'网络安全加固方案' },
      { id:8,  name:'陈伟',   abbr:'陈', project:'Oracle数据库迁移',     progress:55,  submitted:true,  tomorrowStatus:'back_to_office' },
      { id:9,  name:'孙鹏',   abbr:'孙', project:'OA系统上线支持',       progress:70,  submitted:false, tomorrowStatus:'in_project',     tomorrowTarget:'OA系统上线支持' },
      { id:10, name:'黄磊',   abbr:'黄', project:'Zabbix监控部署',      progress:85,  submitted:true,  tomorrowStatus:'back_to_office' },
      { id:11, name:'吴鑫',   abbr:'吴', project:'容灾演练方案实施',     progress:40,  submitted:true,  tomorrowStatus:'in_project',     tomorrowTarget:'容灾演练方案实施' },
      { id:12, name:'郑宇',   abbr:'郑', project:'IDC机房季度巡检',     progress:95,  submitted:true,  tomorrowStatus:'unavailable' },
      { id:13, name:'林峰',   abbr:'林', project:'K8s集群搭建',          progress:20,  submitted:false, tomorrowStatus:'in_project',     tomorrowTarget:'K8s集群搭建' },
      { id:14, name:'何杰',   abbr:'何', project:'备份系统数据恢复测试', progress:50,  submitted:true,  tomorrowStatus:'back_to_office' },
      { id:15, name:'高阳',   abbr:'高', project:'VMware虚拟化部署',     progress:65,  submitted:true,  tomorrowStatus:'in_project',     tomorrowTarget:'VMware虚拟化部署' },
      { id:16, name:'马超',   abbr:'马', project:'存储系统扩容',          progress:35,  submitted:false, tomorrowStatus:'back_to_office' },
      { id:17, name:'梁宇',   abbr:'梁', project:'JumpServer堡垒机安装', progress:100, submitted:true,  tomorrowStatus:'in_project',     tomorrowTarget:'JumpServer堡垒机安装' },
      { id:18, name:'宋涛',   abbr:'宋', project:'ELK日志平台搭建',      progress:10,  submitted:false, tomorrowStatus:'unavailable' },
      { id:19, name:'唐杰',   abbr:'唐', project:'APM全链路监控接入',    progress:88,  submitted:true,  tomorrowStatus:'in_project',     tomorrowTarget:'APM全链路监控接入' },
      { id:20, name:'韩冰',   abbr:'韩', project:'等保安全审计',          progress:72,  submitted:true,  tomorrowStatus:'back_to_office' },
    ];

    function getToday() { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
    function fmtDate(s) { const d=new Date(s+'T00:00:00'); return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'; }
    function pc(p) { return p>=100?'#44cc77':p>=60?'#4f8ef7':p>=20?'#ffaa00':'#ff4444'; }
    function sc(s) { return s==='in_project'?'#44cc77':s==='back_to_office'?'#4f8ef7':'#ffaa00'; }
    function sbg(s) { return s==='in_project'?'rgba(68,204,119,.15)':s==='back_to_office'?'rgba(79,142,247,.15)':'rgba(255,170,0,.15)'; }

    // 自动计算最优列数
    function calcCols(total, w) {
      const itemW = SQ + GAP;
      const max = Math.max(1, Math.floor((w + GAP) / itemW));
      for (let c = max; c >= 1; c--) if (total % c === 0) return c;
      return Math.min(total, max);
    }

    // ====== Modal ======
    function Modal({ show, onClose, title, children }) {
      if (!show) return null;
      return (
        <div className="modal-overlay fixed inset-0 z-50 flex items-center justify-center"
             style={{ background:'rgba(0,0,0,.75)' }} onClick={onClose}>
          <div className="modal-content rounded-xl border" style={{ background:'#111', borderColor:'#333', minWidth:360, maxWidth:480 }} onClick={e=>e.stopPropagation()}>
            <div className="flex items-center justify-between px-6 py-4" style={{ borderBottom:'1px solid #222' }}>
              <span className="text-base font-semibold">{title}</span>
              <button onClick={onClose} className="flex items-center justify-center rounded-md text-sm transition"
                      style={{ width:28,height:28,color:'#666' }}
                      onMouseOver={e=>e.currentTarget.style.color='#fff'} onMouseOut={e=>e.currentTarget.style.color='#666'}>✕</button>
            </div>
            <div className="px-6 py-5">{children}</div>
          </div>
        </div>
      );
    }

    // ====== 左上部 — 日期 + 统计 ======
    function StatsCard({ dateStr, total, submitted, notSubmitted, onDateChange, onNotSubmitClick }) {
      const [showPicker,setShowPicker] = useState(false);
      const pickerRef = useRef(null);
      useEffect(() => {
        function h(e) { if(pickerRef.current&&!pickerRef.current.contains(e.target)) setShowPicker(false); }
        if(showPicker) document.addEventListener('mousedown',h);
        return ()=>document.removeEventListener('mousedown',h);
      },[showPicker]);

      return (
        <div className="rounded-xl border h-full flex flex-col" style={{ background:'var(--bg-card)', borderColor:'var(--border)', padding:'18px 24px' }}>
          {/* 日期 — 缩小 */}
          <div className="flex items-center gap-2 flex-shrink-0" style={{ fontSize:15, color:'var(--text-secondary)' }}>
            <span style={{ cursor:'pointer' }} onClick={()=>setShowPicker(true)}>{fmtDate(dateStr)}</span>
            <span style={{ fontSize:13, cursor:'pointer' }} onClick={()=>setShowPicker(true)}>📅</span>
            {showPicker && <div ref={pickerRef} style={{ position:'relative' }}>
              <input type="date" value={dateStr} className="form-input" autoFocus
                     onChange={e=>{onDateChange(e.target.value);setShowPicker(false)}}
                     style={{ position:'absolute',top:-2,left:0,width:150,fontSize:12,zIndex:20 }} />
            </div>}
          </div>

          {/* 在职工程师 — hero 数字 */}
          <div className="flex flex-col items-center justify-center" style={{ flex:1 }}>
            <span className="font-black tracking-tight" style={{ fontSize:60, lineHeight:1 }}>{total}</span>
            <span style={{ fontSize:13, color:'var(--text-secondary)', marginTop:2 }}>在职工程师</span>
          </div>

          {/* 已提交 / 未提交 */}
          <div className="flex items-center justify-center gap-6 flex-shrink-0" style={{ paddingBottom:2 }}>
            <div className="text-center">
              <span className="font-bold" style={{ fontSize:36, lineHeight:1.2, color:'var(--success)' }}>{submitted}</span>
              <div style={{ fontSize:11, color:'#666' }}>已提交</div>
            </div>
            <div className="text-center cursor-pointer transition rounded px-3 py-1"
                 style={{ margin:'-4px 0' }}
                 onClick={onNotSubmitClick}
                 onMouseOver={e=>{e.currentTarget.style.background='rgba(255,68,68,.08)'}}
                 onMouseOut={e=>{e.currentTarget.style.background='transparent'}}>
              <span className="font-bold" style={{ fontSize:36, lineHeight:1.2, color:'var(--danger)' }}>{notSubmitted}</span>
              <div style={{ fontSize:11, color:'var(--danger)' }}>未提交</div>
            </div>
          </div>
        </div>
      );
    }

    // ====== 左下部 — 工程师状态 ======
    function EngineerList({ engineers, onRowClick }) {
      return (
        <div className="rounded-xl border flex flex-col" style={{ background:'var(--bg-card)', borderColor:'var(--border)', height:'100%' }}>
          <div style={{ fontSize:13, fontWeight:600, color:'#ccc', padding:'14px 18px 10px', borderBottom:'1px solid #222' }}>工程师状态</div>
          <div className="list-scroll flex-1" style={{ overflowY:'auto', minHeight:0 }}>
            {engineers.map(e => (
              <div key={e.id} className="eng-row flex items-center gap-2.5 px-4"
                   style={{ padding:'7px 16px', borderBottom:'1px solid rgba(255,255,255,.04)', fontSize:13 }}
                   onClick={()=>onRowClick(e)}>
                <div className="flex items-center justify-center rounded font-black flex-shrink-0"
                     style={{ width:24,height:24,background:'#fff',color:'#000',fontSize:10 }}>{e.abbr}</div>
                <span className="font-semibold flex-shrink-0" style={{ fontSize:13, minWidth:36 }}>{e.name}</span>
                <span className="truncate" style={{ fontSize:12, color:'#999', minWidth:0, maxWidth:'30%' }}>{e.project}</span>
                <span className="font-medium flex-shrink-0" style={{ fontSize:12, color:pc(e.progress), minWidth:34 }}>{e.progress}%</span>
                <span className="inline-flex items-center gap-1 rounded px-1.5 flex-shrink-0"
                      style={{ fontSize:11, background:e.submitted?'rgba(68,204,119,.12)':'rgba(255,68,68,.12)', color:e.submitted?'#44cc77':'#ff4444', lineHeight:'18px' }}>
                  {e.submitted?'已提交':'未提交'}
                </span>
                <span className="inline-flex items-center gap-1 rounded px-1.5 flex-shrink-0"
                      style={{ fontSize:11, background:sbg(e.tomorrowStatus), color:sc(e.tomorrowStatus), lineHeight:'18px' }}>
                  <span style={{ width:5,height:5,borderRadius:'50%',background:sc(e.tomorrowStatus),display:'inline-block' }}></span>
                  {TOMORROW[e.tomorrowStatus]}
                </span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ====== 右上部 — 日报提交情况 ======
    function SubmitGrid({ engineers, onRedClick, onTooltip, hideTooltip }) {
      const ref = useRef(null);
      const [cols, setCols] = useState(10);

      useEffect(() => {
        if (ref.current) {
          const w = ref.current.clientWidth;
          setCols(calcCols(engineers.length, w));
        }
      }, [engineers.length]);

      return (
        <div className="rounded-xl border flex flex-col" style={{ background:'var(--bg-card)', borderColor:'var(--border)', height:'100%', padding:'16px 20px' }}>
          <div style={{ fontSize:13, fontWeight:600, color:'#ccc', paddingBottom:8, flexShrink:0 }}>日报提交情况</div>
          <div ref={ref} className="flex-1 flex items-center justify-center" style={{ minHeight:0 }}>
            <div className="grid" style={{ gridTemplateColumns:`repeat(${cols}, ${SQ}px)`, gap:`${GAP}px` }}>
              {engineers.map(e => (
                <div key={e.id} className="sq-36" style={{ background:e.submitted?'#44cc77':'#ff4444' }}
                     onClick={()=>{if(!e.submitted) onRedClick(e);}}
                     onMouseEnter={e2=>{const r=e2.target.getBoundingClientRect();onTooltip(e.name+(e.submitted?' · 已提交':' · 未提交'),r.right+8,r.top-4)}}
                     onMouseLeave={hideTooltip} />
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ====== 右下部 — 明日出勤情况 ======
    function AttendGrid({ engineers, onSquareClick, onTooltip, hideTooltip }) {
      const ref = useRef(null);
      const [cols, setCols] = useState(10);

      useEffect(() => {
        if (ref.current) {
          const w = ref.current.clientWidth;
          setCols(calcCols(engineers.length, w));
        }
      }, [engineers.length]);

      const inP = engineers.filter(e=>e.tomorrowStatus==='in_project').length;
      const inO = engineers.filter(e=>e.tomorrowStatus==='back_to_office').length;
      const onL = engineers.filter(e=>e.tomorrowStatus==='unavailable').length;

      return (
        <div className="rounded-xl border flex flex-col" style={{ background:'var(--bg-card)', borderColor:'var(--border)', height:'100%', padding:'16px 20px' }}>
          <div style={{ fontSize:13, fontWeight:600, color:'#ccc', flexShrink:0 }}>明日出勤情况</div>
          {/* 图例 */}
          <div className="flex gap-3 flex-shrink-0" style={{ padding:'6px 0 4px' }}>
            {[{c:'#44cc77',l:'有项目在外'},{c:'#4f8ef7',l:'在公司'},{c:'#ffaa00',l:'请假'}].map(i=>(
              <div key={i.c} className="flex items-center gap-1.5">
                <span className="legend-sq" style={{ background:i.c }}></span>
                <span style={{ fontSize:11, color:'#888' }}>{i.l}</span>
              </div>
            ))}
          </div>
          {/* 格子 */}
          <div ref={ref} className="flex items-center justify-center" style={{ flex:1, minHeight:0 }}>
            <div className="grid" style={{ gridTemplateColumns:`repeat(${cols}, ${SQ}px)`, gap:`${GAP}px` }}>
              {engineers.map(e => {
                const bg = e.tomorrowStatus==='in_project'?'#44cc77':e.tomorrowStatus==='back_to_office'?'#4f8ef7':'#ffaa00';
                return (
                  <div key={e.id} className="sq-36" style={{ background:bg }}
                       onClick={()=>onSquareClick(e)}
                       onMouseEnter={e2=>{const r=e2.target.getBoundingClientRect();const lb=e.name+' · '+TOMORROW[e.tomorrowStatus]+(e.tomorrowTarget?' · '+e.tomorrowTarget:'');onTooltip(lb,r.right+8,r.top-4)}}
                       onMouseLeave={hideTooltip} />
                );
              })}
            </div>
          </div>
          {/* 汇总 */}
          <div className="flex gap-4 justify-center flex-shrink-0" style={{ paddingTop:8 }}>
            <span style={{ fontSize:12, color:'var(--text-secondary)' }}>有项目在外 <strong style={{ color:'#44cc77' }}>{inP}</strong>人</span>
            <span style={{ fontSize:12, color:'var(--text-secondary)' }}>在公司 <strong style={{ color:'#4f8ef7' }}>{inO}</strong>人</span>
            <span style={{ fontSize:12, color:'var(--text-secondary)' }}>请假 <strong style={{ color:'#ffaa00' }}>{onL}</strong>人</span>
          </div>
        </div>
      );
    }

    // ====== 工程师概览弹窗 ======
    function EngOverview({ engineer, onClose }) {
      if(!engineer) return null;
      return (
        <Modal show={true} onClose={onClose} title="工程师概览">
          <div className="space-y-4">
            <div className="flex items-center gap-3">
              <div className="flex items-center justify-center font-black rounded-lg" style={{ width:44,height:44,background:'#fff',color:'#000',fontSize:16 }}>{engineer.abbr}</div>
              <div><div className="text-lg font-bold">{engineer.name}</div><div style={{ color:'#888',fontSize:12 }}>ID: {engineer.id}</div></div>
            </div>
            <div><div style={{ color:'#888',fontSize:12,marginBottom:4 }}>今日项目</div><div className="font-medium" style={{ fontSize:14 }}>{engineer.project}</div></div>
            <div><div style={{ color:'#888',fontSize:12,marginBottom:4 }}>进度 <strong style={{ color:'#fff' }}>{engineer.progress}%</strong></div>
              <div className="w-full rounded-full" style={{ height:5,background:'#222' }}><div className="rounded-full" style={{ width:`${Math.max(engineer.progress,4)}%`,height:5,background:pc(engineer.progress) }}></div></div>
            </div>
            <div className="flex gap-4">
              <div><div style={{ color:'#888',fontSize:12,marginBottom:2 }}>日报</div>
                <span className="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-sm font-medium"
                      style={{ background:engineer.submitted?'rgba(68,204,119,.15)':'rgba(255,68,68,.15)', color:engineer.submitted?'#44cc77':'#ff4444' }}>
                  <span style={{ width:6,height:6,borderRadius:'50%',background:engineer.submitted?'#44cc77':'#ff4444',display:'inline-block' }}></span>
                  {engineer.submitted?'已提交':'未提交'}
                </span>
              </div>
              <div><div style={{ color:'#888',fontSize:12,marginBottom:2 }}>明日去向</div>
                <span className="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-sm font-medium"
                      style={{ background:sbg(engineer.tomorrowStatus), color:sc(engineer.tomorrowStatus) }}>
                  <span style={{ width:6,height:6,borderRadius:'50%',background:sc(engineer.tomorrowStatus),display:'inline-block' }}></span>
                  {TOMORROW[engineer.tomorrowStatus]}
                </span>
              </div>
            </div>
            {engineer.tomorrowTarget && <div><div style={{ color:'#888',fontSize:12,marginBottom:2 }}>去向详情</div><div className="font-medium">{engineer.tomorrowTarget}</div></div>}
          </div>
        </Modal>
      );
    }

    // ====== 未提交名单 ======
    function NotSubModal({ engineers, show, onClose }) {
      const ns = engineers.filter(e=>!e.submitted);
      return (
        <Modal show={show} onClose={onClose} title={`未提交日报（${ns.length}人）`}>
          {ns.length===0 ? <div style={{ color:'#666',fontSize:13,textAlign:'center',padding:'20px 0' }}>全部已提交 ✓</div>
          : ns.map(e=>(
            <div key={e.id} className="flex items-center gap-3 rounded-lg px-3 py-2" style={{ background:'#0d0d0d' }}>
              <div className="flex items-center justify-center rounded font-black flex-shrink-0" style={{ width:26,height:26,background:'#fff',color:'#000',fontSize:10 }}>{e.abbr}</div>
              <span className="font-medium" style={{ fontSize:14 }}>{e.name}</span>
            </div>
          ))}
        </Modal>
      );
    }

    // ====== App ======
    function App() {
      const today = getToday();
      const [selDate, setSelDate] = useState(today);
      const [engineers, setEngineers] = useState(MOCK);
      const [modal, setModal] = useState(null);
      const [tooltip, setTooltip] = useState(null);

      const showTip = useCallback((t,x,y)=>setTooltip({text:t,x,y}),[]);
      const hideTip = useCallback(()=>setTooltip(null),[]);

      const total = engineers.length;
      const sub = engineers.filter(e=>e.submitted).length;
      const notSub = total - sub;

      const hDate = d => {
        setSelDate(d);
        setEngineers(d!==today ? MOCK.map(e=>({...e,submitted:Math.random()>0.3,progress:Math.min(100,e.progress+Math.round(Math.random()*20-10))})) : MOCK);
      };
      const closeModal = ()=>setModal(null);
      const hRow = e=>setModal({type:'eng',data:e});
      const hRed = e=>setModal({type:'red',data:e});
      const hNotSub = ()=>setModal({type:'notSub'});
      const hAtt = e=>setModal({type:'att',data:e});

      const AttDetail = ()=>{
        const e=modal?.data; if(!e) return null;
        return (
          <Modal show={true} onClose={closeModal} title="明日出勤详情">
            <div className="space-y-4">
              <div className="flex items-center gap-3">
                <div className="flex items-center justify-center rounded font-black" style={{ width:36,height:36,background:'#fff',color:'#000',fontSize:14 }}>{e.abbr}</div>
                <span className="text-lg font-bold">{e.name}</span>
              </div>
              <div className="flex items-center gap-2 rounded-lg px-3 py-2.5" style={{ background:'#0d0d0d' }}>
                <span style={{ width:10,height:10,borderRadius:3,background:sc(e.tomorrowStatus),display:'inline-block' }}></span>
                <span>明日状态：<strong>{TOMORROW[e.tomorrowStatus]}</strong></span>
              </div>
              {e.tomorrowTarget && <div><div style={{ color:'#888',fontSize:12,marginBottom:4 }}>去向详情</div><div className="font-medium">{e.tomorrowTarget}</div></div>}
              {!e.tomorrowTarget && e.tomorrowStatus==='back_to_office' && <div style={{ color:'#4f8ef7',fontSize:13 }}>回公司办公</div>}
              {e.tomorrowStatus==='unavailable' && <div style={{ color:'#ffaa00',fontSize:13 }}>请假</div>}
            </div>
          </Modal>
        );
      };

      return (
        <div style={{ height:'100%', display:'flex', flexDirection:'column' }}>
          <div className="flex gap-4 flex-1 min-h-0">
            {/* 左 55% */}
            <div className="flex flex-col gap-3" style={{ flex:'55', minWidth:0, minHeight:0 }}>
              <div style={{ height:'30%', minHeight:0 }} className="flex-shrink-0">
                <StatsCard dateStr={selDate} total={total} submitted={sub} notSubmitted={notSub}
                           onDateChange={hDate} onNotSubmitClick={hNotSub} />
              </div>
              <div style={{ flex:1, minHeight:0 }}>
                <EngineerList engineers={engineers} onRowClick={hRow} />
              </div>
            </div>
            {/* 右 45% */}
            <div className="flex flex-col gap-3" style={{ flex:'45', minWidth:0, minHeight:0 }}>
              <div style={{ flex:1, minHeight:0 }}>
                <SubmitGrid engineers={engineers} onRedClick={hRed} onTooltip={showTip} hideTooltip={hideTip} />
              </div>
              <div style={{ flex:1, minHeight:0 }}>
                <AttendGrid engineers={engineers} onSquareClick={hAtt} onTooltip={showTip} hideTooltip={hideTip} />
              </div>
            </div>
          </div>

          <NotSubModal engineers={engineers} show={modal?.type==='notSub'} onClose={closeModal} />
          {modal?.type==='red' && (
            <Modal show={true} onClose={closeModal} title="未提交日报">
              <div className="flex items-center gap-3 mb-3">
                <div className="flex items-center justify-center rounded font-black" style={{ width:36,height:36,background:'#fff',color:'#000',fontSize:14 }}>{modal.data.abbr}</div>
                <span className="text-lg font-bold">{modal.data.name}</span>
              </div>
              <div className="flex items-center gap-2 rounded-lg px-3 py-2.5" style={{ background:'#0d0d0d',color:'#ff4444' }}>
                <span>⚠</span><span>该工程师今日尚未提交日报</span>
              </div>
            </Modal>
          )}
          {modal?.type==='eng' && <EngOverview engineer={modal.data} onClose={closeModal} />}
          {modal?.type==='att' && <AttDetail />}
          {tooltip && <div className="tooltip-el" style={{ left:tooltip.x, top:tooltip.y }}>{tooltip.text}</div>}
        </div>
      );
    }

    document.addEventListener('authReady', () => {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    });
  </script>
</body>
</html>
