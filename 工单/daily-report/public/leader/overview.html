<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日报概览</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body, #root {
      height: 100%; width: 100%; overflow: hidden;
      background: #000;
      color: #fff;
      font-family: 'SF Pro Display', 'PingFang SC', system-ui, -apple-system, sans-serif;
    }

    /* 自定义滚动条 */
    .scrollbar-dark::-webkit-scrollbar { width: 4px; }
    .scrollbar-dark::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-dark::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    /* 格子通用 */
    .grid-sq {
      width: 28px; height: 28px; border-radius: 4px;
      transition: all .12s; cursor: pointer; flex-shrink: 0;
    }
    .grid-sq:hover { transform: scale(1.15); opacity: .85; }

    /* tooltip */
    .tooltip-el {
      position: fixed; pointer-events: none; z-index: 9999;
      padding: 5px 10px; border-radius: 6px; font-size: 12px;
      background: #1a1a1a; color: #fff; border: 1px solid #333;
      white-space: nowrap;
    }

    /* 模态遮罩动画 */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .modal-overlay { animation: fadeIn .15s ease-out; }
    .modal-content { animation: slideUp .2s ease-out; }

    /* 工程师行 hover */
    .eng-row { transition: background .12s; cursor: pointer; }
    .eng-row:hover { background: rgba(255,255,255,.04); }
  </style>
</head>
<body>
  <div id="root">加载中...</div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // ============================================================
    // Mock 数据（20 人）
    // ============================================================
    const MOCK_ENGINEERS = [
      { id:1,  name:'王涛',   abbr:'王', project:'清科管理·AnyShare部署',   progress:75, submitted:true,  tomorrowStatus:'in_project',     tomorrowTarget:'清科管理·AnyShare部署' },
      { id:2,  name:'张宏洋', abbr:'张', project:'某银行核心系统升级',       progress:100, submitted:true,  tomorrowStatus:'back_to_office' },
      { id:3,  name:'周继成', abbr:'周', project:'数据中心网络迁移',         progress:45,  submitted:false, tomorrowStatus:'in_project',     tomorrowTarget:'数据中心网络迁移' },
      { id:4,  name:'张学龙', abbr:'学', project:'医院HIS系统对接',          progress:60,  submitted:true,  tomorrowStatus:'back_to_office' },
      { id:5,  name:'李明',   abbr:'李', project:'政务云平台部署',           progress:90,  submitted:false, tomorrowStatus:'unavailable' },
      { id:6,  name:'赵强',   abbr:'赵', project:'ERP系统调试优化',          progress:30,  submitted:true,  tomorrowStatus:'in_project',     tomorrowTarget:'ERP系统调试优化' },
      { id:7,  name:'刘洋',   abbr:'刘', project:'网络安全加固方案',          progress:80,  submitted:true,  tomorrowStatus:'in_project',     tomorrowTarget:'网络安全加固方案' },
      { id:8,  name:'陈伟',   abbr:'陈', project:'Oracle数据库迁移',         progress:55,  submitted:true,  tomorrowStatus:'back_to_office' },
      { id:9,  name:'孙鹏',   abbr:'孙', project:'OA系统上线支持',           progress:70,  submitted:false, tomorrowStatus:'in_project',     tomorrowTarget:'OA系统上线支持' },
      { id:10, name:'黄磊',   abbr:'黄', project:'Zabbix监控部署',          progress:85,  submitted:true,  tomorrowStatus:'back_to_office' },
      { id:11, name:'吴鑫',   abbr:'吴', project:'容灾演练方案实施',          progress:40,  submitted:true,  tomorrowStatus:'in_project',     tomorrowTarget:'容灾演练方案实施' },
      { id:12, name:'郑宇',   abbr:'郑', project:'IDC机房季度巡检',          progress:95,  submitted:true,  tomorrowStatus:'unavailable' },
      { id:13, name:'林峰',   abbr:'林', project:'K8s集群搭建',              progress:20,  submitted:false, tomorrowStatus:'in_project',     tomorrowTarget:'K8s集群搭建' },
      { id:14, name:'何杰',   abbr:'何', project:'备份系统数据恢复测试',      progress:50,  submitted:true,  tomorrowStatus:'back_to_office' },
      { id:15, name:'高阳',   abbr:'高', project:'VMware虚拟化部署',         progress:65,  submitted:true,  tomorrowStatus:'in_project',     tomorrowTarget:'VMware虚拟化部署' },
      { id:16, name:'马超',   abbr:'马', project:'存储系统扩容',              progress:35,  submitted:false, tomorrowStatus:'back_to_office' },
      { id:17, name:'梁宇',   abbr:'梁', project:'JumpServer堡垒机安装',     progress:100, submitted:true,  tomorrowStatus:'in_project',     tomorrowTarget:'JumpServer堡垒机安装' },
      { id:18, name:'宋涛',   abbr:'宋', project:'ELK日志平台搭建',          progress:10,  submitted:false, tomorrowStatus:'unavailable' },
      { id:19, name:'唐杰',   abbr:'唐', project:'APM全链路监控接入',        progress:88,  submitted:true,  tomorrowStatus:'in_project',     tomorrowTarget:'APM全链路监控接入' },
      { id:20, name:'韩冰',   abbr:'韩', project:'等保安全审计',              progress:72,  submitted:true,  tomorrowStatus:'back_to_office' },
    ];

    const TOMORROW_LABEL = {
      'in_project':     '有项目在外',
      'back_to_office': '在公司',
      'unavailable':    '请假',
    };

    const GRID_COLS = 7;   // 每行格子数
    const SQ = 28;          // 格子 px
    const GAP = 6;          // 间距 px

    // ============================================================
    // 工具
    // ============================================================
    function todayCN() {
      const d = new Date();
      return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
    }

    function progressColor(p) {
      if (p >= 100) return '#44cc77';
      if (p >= 60)  return '#4f8ef7';
      if (p >= 20)  return '#ffaa00';
      return '#ff4444';
    }

    // ============================================================
    // Modal 组件
    // ============================================================
    function Modal({ show, onClose, title, children }) {
      if (!show) return null;
      return (
        <div className="modal-overlay fixed inset-0 z-50 flex items-center justify-center"
             style={{ background: 'rgba(0,0,0,.75)' }}
             onClick={onClose}>
          <div className="modal-content rounded-xl border"
               style={{ background:'#111', borderColor:'#333', minWidth:360, maxWidth:480 }}
               onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between px-6 py-4"
                 style={{ borderBottom:'1px solid #222' }}>
              <span className="text-base font-semibold">{title}</span>
              <button onClick={onClose}
                      className="flex items-center justify-center rounded-md text-sm transition"
                      style={{ width:28, height:28, color:'#666' }}
                      onMouseOver={e => e.currentTarget.style.color='#fff'}
                      onMouseOut={e => e.currentTarget.style.color='#666'}>
                ✕
              </button>
            </div>
            <div className="px-6 py-5">
              {children}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // EngineerOverview 组件（工程师概览弹窗）
    // ============================================================
    function EngineerOverview({ engineer, onClose }) {
      if (!engineer) return null;
      const barW = Math.max(engineer.progress, 4);
      return (
        <Modal show={true} onClose={onClose} title="工程师概览">
          <div className="space-y-5">
            {/* 头部 */}
            <div className="flex items-center gap-4">
              <div className="flex items-center justify-center font-black rounded-lg"
                   style={{ width:48, height:48, background:'#fff', color:'#000', fontSize:18 }}>
                {engineer.abbr}
              </div>
              <div>
                <div className="text-lg font-bold">{engineer.name}</div>
                <div style={{ color:'#888', fontSize:13 }}>ID: {engineer.id}</div>
              </div>
            </div>

            {/* 今日项目 */}
            <div>
              <div style={{ color:'#888', fontSize:12, marginBottom:6 }}>今日项目</div>
              <div className="font-medium" style={{ fontSize:14 }}>{engineer.project}</div>
            </div>

            {/* 进度条 */}
            <div>
              <div style={{ color:'#888', fontSize:12, marginBottom:6 }}>
                进度 <span style={{ color:'#fff', fontWeight:600 }}>{engineer.progress}%</span>
              </div>
              <div className="w-full rounded-full" style={{ height:6, background:'#222' }}>
                <div className="rounded-full transition-all" style={{ width:`${barW}%`, height:6, background:progressColor(engineer.progress) }}></div>
              </div>
            </div>

            {/* 日报状态 */}
            <div className="flex gap-6">
              <div>
                <div style={{ color:'#888', fontSize:12, marginBottom:2 }}>今日日报</div>
                <span className="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-sm font-medium"
                      style={{ background: engineer.submitted ? 'rgba(68,204,119,.15)' : 'rgba(255,68,68,.15)',
                               color: engineer.submitted ? '#44cc77' : '#ff4444' }}>
                  <span style={{ width:6, height:6, borderRadius:'50%', background: engineer.submitted ? '#44cc77' : '#ff4444', display:'inline-block' }}></span>
                  {engineer.submitted ? '已提交' : '未提交'}
                </span>
              </div>
              <div>
                <div style={{ color:'#888', fontSize:12, marginBottom:2 }}>明日去向</div>
                <span className="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-sm font-medium"
                      style={{ background: statusBg(engineer.tomorrowStatus), color: statusColor(engineer.tomorrowStatus) }}>
                  {statusDot(engineer.tomorrowStatus)}
                  {TOMORROW_LABEL[engineer.tomorrowStatus]}
                </span>
              </div>
            </div>

            {engineer.tomorrowTarget && (
              <div>
                <div style={{ color:'#888', fontSize:12, marginBottom:2 }}>明日去向详情</div>
                <div className="font-medium" style={{ fontSize:14 }}>{engineer.tomorrowTarget}</div>
              </div>
            )}
          </div>
        </Modal>
      );
    }

    // 颜色辅助
    function statusBg(s) {
      if (s === 'in_project')     return 'rgba(68,204,119,.15)';
      if (s === 'back_to_office') return 'rgba(79,142,247,.15)';
      return 'rgba(255,170,0,.15)';
    }
    function statusColor(s) {
      if (s === 'in_project')     return '#44cc77';
      if (s === 'back_to_office') return '#4f8ef7';
      return '#ffaa00';
    }
    function statusDot(s) {
      const c = statusColor(s);
      return <span style={{ width:6, height:6, borderRadius:'50%', background:c, display:'inline-block' }}></span>;
    }

    // ============================================================
    // 顶部左侧 — 在职工程师总数卡片
    // ============================================================
    function TotalCard({ count }) {
      return (
        <div className="rounded-xl border flex flex-col justify-center items-center"
             style={{ background:'#111', borderColor:'#222', padding:'24px 16px', minWidth:0 }}>
          <div style={{ color:'#888', fontSize:13, fontWeight:500, letterSpacing:'.5px' }}>在职工程师</div>
          <div className="font-black tracking-tight" style={{ fontSize:56, lineHeight:1.1, marginTop:8 }}>
            {count}
          </div>
          <div style={{ color:'#555', fontSize:12, marginTop:6 }}>人</div>
        </div>
      );
    }

    // ============================================================
    // 顶部中间 — 日期 + 提交统计
    // ============================================================
    function DateStatsCard({ submitted, notSubmitted, onNotSubmittedClick }) {
      return (
        <div className="rounded-xl border flex flex-col justify-center items-center"
             style={{ background:'#111', borderColor:'#222', padding:'20px 16px', minWidth:0 }}>
          <div className="font-bold tracking-tight text-center" style={{ fontSize:22, lineHeight:1.3 }}>
            {todayCN()}
          </div>
          <div className="flex gap-3 w-full mt-4" style={{ maxWidth:220 }}>
            <div className="flex-1 rounded-lg border text-center py-3"
                 style={{ background:'#0d0d0d', borderColor:'#2a2a2a' }}>
              <div className="font-bold" style={{ fontSize:24, color:'#44cc77' }}>{submitted}</div>
              <div style={{ fontSize:11, color:'#666' }}>已提交</div>
            </div>
            <div className="flex-1 rounded-lg border text-center py-3 cursor-pointer transition"
                 style={{ background:'#0d0d0d', borderColor:'#2a2a2a' }}
                 onClick={onNotSubmittedClick}
                 onMouseOver={e => { e.currentTarget.style.borderColor='#ff4444'; e.currentTarget.style.background='#1a0a0a'; }}
                 onMouseOut={e => { e.currentTarget.style.borderColor='#2a2a2a'; e.currentTarget.style.background='#0d0d0d'; }}>
              <div className="font-bold" style={{ fontSize:24, color:'#ff4444' }}>{notSubmitted}</div>
              <div style={{ fontSize:11, color:'#ff4444' }}>未提交</div>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // 顶部右侧 — 日报提交情况格子图
    // ============================================================
    function SubmissionGrid({ engineers, onRedClick, onTooltip, hideTooltip }) {
      return (
        <div className="rounded-xl border flex-1 flex flex-col"
             style={{ background:'#111', borderColor:'#222', padding:'20px' }}>
          <div style={{ fontSize:13, fontWeight:600, color:'#ccc', marginBottom:12 }}>日报提交情况</div>
          <div className="flex" style={{ gap: GAP, flexWrap:'wrap', alignContent:'flex-start' }}>
            {engineers.map(e => (
              <div key={e.id}
                   className="grid-sq"
                   style={{ background: e.submitted ? '#44cc77' : '#ff4444' }}
                   onClick={() => { if (!e.submitted) onRedClick(e); }}
                   onMouseEnter={e2 => {
                     const rect = e2.target.getBoundingClientRect();
                     onTooltip(e.name + (e.submitted ? ' · 已提交' : ' · 未提交'), rect.right + 8, rect.top - 4);
                   }}
                   onMouseLeave={hideTooltip}>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ============================================================
    // 底部左侧 — 工程师状态列表
    // ============================================================
    function EngineerStatusList({ engineers, onRowClick }) {
      return (
        <div className="rounded-xl border flex flex-col"
             style={{ background:'#111', borderColor:'#222', padding:'16px 0' }}>
          <div style={{ fontSize:13, fontWeight:600, color:'#ccc', padding:'0 16px 12px', borderBottom:'1px solid #222' }}>
            工程师状态
          </div>
          <div className="flex-1 scrollbar-dark" style={{ overflowY:'auto', minHeight:0 }}>
            {engineers.map(e => (
              <div key={e.id} className="eng-row flex items-center px-4 py-2.5"
                   style={{ borderBottom:'1px solid rgba(255,255,255,.04)' }}
                   onClick={() => onRowClick(e)}>
                <div className="flex items-center justify-center rounded font-black flex-shrink-0"
                     style={{ width:28, height:28, background:'#fff', color:'#000', fontSize:11, marginRight:10 }}>
                  {e.abbr}
                </div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2">
                    <span className="font-semibold" style={{ fontSize:13 }}>{e.name}</span>
                    <span style={{ fontSize:11, color:'#666' }}>·</span>
                    <span style={{ fontSize:12, color:'#999' }} className="truncate">今天：{e.project}</span>
                  </div>
                  <div className="flex items-center gap-3 mt-0.5">
                    <span style={{ fontSize:11, color: e.submitted ? '#44cc77' : '#ff4444' }}>
                      {e.submitted ? '已提交' : '未提交'}
                    </span>
                    <span style={{ fontSize:11, color: progressColor(e.progress) }}>
                      进度 {e.progress}%
                    </span>
                    <span style={{ fontSize:11, color: statusColor(e.tomorrowStatus) }}>
                      明天 {TOMORROW_LABEL[e.tomorrowStatus]}
                    </span>
                  </div>
                </div>
                <span style={{ fontSize:16, color:'#444', marginLeft:8 }}>›</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ============================================================
    // 底部右侧 — 明日出勤情况格子图
    // ============================================================
    function AttendanceGrid({ engineers, onSquareClick, onTooltip, hideTooltip }) {
      const legendItems = [
        { color:'#44cc77', label:'有项目在外' },
        { color:'#4f8ef7', label:'在公司' },
        { color:'#ffaa00', label:'请假' },
      ];
      return (
        <div className="rounded-xl border flex flex-col"
             style={{ background:'#111', borderColor:'#222', padding:'20px' }}>
          <div style={{ fontSize:13, fontWeight:600, color:'#ccc', marginBottom:12 }}>明日出勤情况</div>
          {/* 图例 */}
          <div className="flex gap-4 mb-3">
            {legendItems.map(item => (
              <div key={item.color} className="flex items-center gap-1.5">
                <span style={{ width:12, height:12, borderRadius:3, background:item.color, display:'inline-block', flexShrink:0 }}></span>
                <span style={{ fontSize:11, color:'#888' }}>{item.label}</span>
              </div>
            ))}
          </div>
          {/* 格子 */}
          <div className="flex" style={{ gap: GAP, flexWrap:'wrap', alignContent:'flex-start' }}>
            {engineers.map(e => {
              const bg = e.tomorrowStatus === 'in_project' ? '#44cc77'
                       : e.tomorrowStatus === 'back_to_office' ? '#4f8ef7'
                       : '#ffaa00';
              return (
                <div key={e.id}
                     className="grid-sq"
                     style={{ background: bg }}
                     onClick={() => onSquareClick(e)}
                     onMouseEnter={e2 => {
                       const rect = e2.target.getBoundingClientRect();
                       const label = `${e.name} · ${TOMORROW_LABEL[e.tomorrowStatus]}` + (e.tomorrowTarget ? ` · ${e.tomorrowTarget}` : '');
                       onTooltip(label, rect.right + 8, rect.top - 4);
                     }}
                     onMouseLeave={hideTooltip}>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ============================================================
    // 未提交名单弹窗
    // ============================================================
    function NotSubmittedModal({ engineers, show, onClose }) {
      const names = engineers.filter(e => !e.submitted);
      return (
        <Modal show={show} onClose={onClose} title={`未提交日报（${names.length}人）`}>
          <div className="space-y-2">
            {names.length === 0 ? (
              <div style={{ color:'#666', fontSize:13, textAlign:'center', padding:'20px 0' }}>全部已提交 ✓</div>
            ) : (
              names.map(e => (
                <div key={e.id} className="flex items-center gap-3 rounded-lg px-3 py-2"
                     style={{ background:'#0d0d0d' }}>
                  <div className="flex items-center justify-center rounded font-black flex-shrink-0"
                       style={{ width:26, height:26, background:'#fff', color:'#000', fontSize:10 }}>
                    {e.abbr}
                  </div>
                  <span className="font-medium" style={{ fontSize:14 }}>{e.name}</span>
                </div>
              ))
            )}
          </div>
        </Modal>
      );
    }

    // ============================================================
    // App 主组件
    // ============================================================
    function App() {
      const engineers = MOCK_ENGINEERS;
      const total = engineers.length;
      const submitted = engineers.filter(e => e.submitted).length;
      const notSubmitted = total - submitted;

      // 弹窗状态
      const [modal, setModal] = useState(null); // { type:'notSubmitted'|'redSquare'|'engineerOverview'|'attendanceDetail', data }
      const [tooltip, setTooltip] = useState(null); // { text, x, y }

      const showTooltip = useCallback((text, x, y) => setTooltip({ text, x, y }), []);
      const hideTooltip = useCallback(() => setTooltip(null), []);

      // 点击未提交卡片
      const handleNotSubmittedClick = () => setModal({ type:'notSubmitted' });

      // 点击红色格子
      const handleRedClick = (eng) => setModal({ type:'redSquare', data:eng });

      // 点击工程师行
      const handleRowClick = (eng) => setModal({ type:'engineerOverview', data:eng });

      // 点击出勤格子
      const handleAttendanceClick = (eng) => setModal({ type:'attendanceDetail', data:eng });

      // 关闭弹窗
      const closeModal = () => setModal(null);

      // 明日出勤详情弹窗
      const renderAttendanceDetail = () => {
        const e = modal?.data;
        if (!e) return null;
        return (
          <Modal show={true} onClose={closeModal} title="明日出勤详情">
            <div className="space-y-4">
              <div className="flex items-center gap-3">
                <div className="flex items-center justify-center rounded font-black"
                     style={{ width:36, height:36, background:'#fff', color:'#000', fontSize:14 }}>
                  {e.abbr}
                </div>
                <span className="text-lg font-bold">{e.name}</span>
              </div>
              <div className="flex items-center gap-2 rounded-lg px-3 py-2.5"
                   style={{ background:'#0d0d0d' }}>
                <span style={{ width:10, height:10, borderRadius:3, background: statusColor(e.tomorrowStatus), display:'inline-block' }}></span>
                <span>明日状态：<strong>{TOMORROW_LABEL[e.tomorrowStatus]}</strong></span>
              </div>
              {e.tomorrowTarget && (
                <div>
                  <div style={{ color:'#888', fontSize:12, marginBottom:4 }}>去向详情</div>
                  <div className="font-medium">{e.tomorrowTarget}</div>
                </div>
              )}
              {!e.tomorrowTarget && e.tomorrowStatus === 'back_to_office' && (
                <div style={{ color:'#4f8ef7', fontSize:13 }}>回公司办公</div>
              )}
              {e.tomorrowStatus === 'unavailable' && (
                <div style={{ color:'#ffaa00', fontSize:13 }}>请假</div>
              )}
            </div>
          </Modal>
        );
      };

      return (
        <div className="h-full w-full flex flex-col p-4 gap-4"
             style={{ background:'#000', minHeight:0 }}>
          {/* ============ 顶栏 ============ */}
          <div className="flex gap-4 flex-shrink-0" style={{ height:'44%', minHeight:260 }}>
            {/* 左侧：在职工程师 */}
            <div className="flex-shrink-0" style={{ width:'16%' }}>
              <TotalCard count={total} />
            </div>
            {/* 中间：日期 + 统计 */}
            <div className="flex-shrink-0" style={{ width:'18%' }}>
              <DateStatsCard submitted={submitted} notSubmitted={notSubmitted}
                             onNotSubmittedClick={handleNotSubmittedClick} />
            </div>
            {/* 右侧：提交情况格子 */}
            <div className="flex-1 min-w-0">
              <SubmissionGrid engineers={engineers}
                              onRedClick={handleRedClick}
                              onTooltip={showTooltip}
                              hideTooltip={hideTooltip} />
            </div>
          </div>

          {/* ============ 底栏 ============ */}
          <div className="flex gap-4 flex-1 min-h-0">
            {/* 左侧：工程师状态列表 */}
            <div className="flex-1 min-w-0" style={{ width:'50%' }}>
              <EngineerStatusList engineers={engineers} onRowClick={handleRowClick} />
            </div>
            {/* 右侧：出勤情况格子 */}
            <div className="flex-1 min-w-0" style={{ width:'50%' }}>
              <AttendanceGrid engineers={engineers}
                              onSquareClick={handleAttendanceClick}
                              onTooltip={showTooltip}
                              hideTooltip={hideTooltip} />
            </div>
          </div>

          {/* ============ Modals ============ */}
          {/* 未提交列表 */}
          <NotSubmittedModal engineers={engineers}
                             show={modal?.type === 'notSubmitted'}
                             onClose={closeModal} />

          {/* 红色格子点击 — 未提交详情 */}
          {modal?.type === 'redSquare' && (
            <Modal show={true} onClose={closeModal} title="未提交日报">
              <div className="flex items-center gap-3 mb-3">
                <div className="flex items-center justify-center rounded font-black"
                     style={{ width:36, height:36, background:'#fff', color:'#000', fontSize:14 }}>
                  {modal.data.abbr}
                </div>
                <span className="text-lg font-bold">{modal.data.name}</span>
              </div>
              <div className="flex items-center gap-2 rounded-lg px-3 py-2.5"
                   style={{ background:'#0d0d0d', color:'#ff4444' }}>
                <span>⚠</span>
                <span>该工程师今日尚未提交日报</span>
              </div>
            </Modal>
          )}

          {/* 工程师概览 */}
          {modal?.type === 'engineerOverview' && (
            <EngineerOverview engineer={modal.data} onClose={closeModal} />
          )}

          {/* 明日出勤详情 */}
          {modal?.type === 'attendanceDetail' && renderAttendanceDetail()}

          {/* ============ Tooltip ============ */}
          {tooltip && (
            <div className="tooltip-el" style={{ left: tooltip.x, top: tooltip.y }}>
              {tooltip.text}
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // 渲染
    // ============================================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
