<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目管理 - 日报管理系统</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-title">日报管理</div>
      <div class="sidebar-nav">
        <a class="nav-item" href="index.html">📊 仪表盘</a>
        <a class="nav-item" href="engineers.html">👤 员工管理</a>
        <a class="nav-item" href="projects.html">📁 项目管理</a>
        <a class="nav-item" href="reports.html">📋 日报管理</a>
        <a class="nav-item" href="hours.html">⏱ 工时管理</a>
        <a class="nav-item" href="accounts.html">🔐 账户管理</a>
      </div>
      <div style="padding:12px 20px;border-top:1px solid var(--border)">
        <a class="nav-item" href="/leader/" style="padding:8px 0">📈 领导看板</a>
      </div>
    </div>
    <div class="main">
      <div class="topbar">
        <span class="topbar-user" id="topbarUser"></span>
        <span class="topbar-user" id="topbarRole"></span>
        <button class="topbar-btn" onclick="logout()">退出</button>
      </div>

      <div class="action-bar">
        <div class="page-title" style="margin-bottom:0">项目管理</div>
        <button class="btn btn-primary" onclick="location.href='project-edit.html'">+ 新建项目</button>
      </div>

      <div class="filter-bar">
        <div class="form-group">
          <label class="form-label">项目名</label>
          <input class="form-input" id="searchKeyword" placeholder="模糊搜索" onkeydown="if(event.key==='Enter')loadProjects()">
        </div>
        <div class="form-group">
          <label class="form-label">工单号</label>
          <input class="form-input" id="searchOrder" placeholder="工单号" onkeydown="if(event.key==='Enter')loadProjects()">
        </div>
        <div class="form-group">
          <label class="form-label">工程师</label>
          <input class="form-input" id="searchEngineer" placeholder="姓名或缩写" onkeydown="if(event.key==='Enter')loadProjects()">
        </div>
        <div class="form-group">
          <button class="btn btn-primary" onclick="loadProjects()" style="margin-top:22px">查询</button>
          <button class="btn btn-secondary" onclick="clearSearch()" style="margin-top:22px;margin-left:6px">重置</button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>项目名</th>
              <th>客户</th>
              <th>工单号</th>
              <th>当前工程师</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="projectTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="admin.js"></script>
  <script>
    async function loadProjects() {
      try {
        const params = new URLSearchParams();
        const kw = document.getElementById('searchKeyword').value.trim();
        const ord = document.getElementById('searchOrder').value.trim();
        const eng = document.getElementById('searchEngineer').value.trim();
        if (kw) params.set('keyword', kw);
        if (ord) params.set('order_no', ord);
        if (eng) params.set('engineer', eng);

        const qs = params.toString();
        const data = (await api(`/api/admin/projects${qs ? '?' + qs : ''}`)).data;
        const tbody = document.getElementById('projectTableBody');
        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state">暂无项目</div></td></tr>';
          return;
        }
        tbody.innerHTML = data.map(p => {
          const avatars = (p.engineers || []).map(e =>
            `<span class="avatar-bubble" title="${e.name}">${e.abbr}</span>`
          ).join('');
          return `<tr>
            <td><strong>${p.name}</strong></td>
            <td>${p.customer}</td>
            <td>${p.order_no || '-'}</td>
            <td><div class="avatar-group">${avatars || '<span style="color:var(--text-dim)">未分配</span>'}</div></td>
            <td>
              <div class="btn-group">
                <button class="btn btn-secondary btn-sm" onclick="location.href='project-edit.html?id=${p.id}'">编辑</button>
              </div>
            </td>
          </tr>`;
        }).join('');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function clearSearch() {
      document.getElementById('searchKeyword').value = '';
      document.getElementById('searchOrder').value = '';
      document.getElementById('searchEngineer').value = '';
      loadProjects();
    }

    loadProjects();
  </script>
</body>
</html>
