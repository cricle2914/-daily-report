<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>权限管理 - 日报管理系统</title>
  <link rel="stylesheet" href="admin.css">
  <style>
    .section-subtitle {
      font-size:13px; color:var(--text-secondary); margin-bottom:12px;
      padding-bottom:8px; border-bottom:1px solid var(--border);
    }
    .perm-badge {
      display:inline-flex; align-items:center; gap:4px;
      padding:2px 10px; border-radius:12px; font-size:11px; font-weight:500;
      background:rgba(79,142,247,.15); color:var(--accent); margin:2px;
    }
    .perm-badge .remove {
      cursor:pointer; opacity:.6; font-size:13px; line-height:1;
    }
    .perm-badge .remove:hover { opacity:1; }
    .tab-bar { display:flex; gap:4px; margin-bottom:16px; }
    .tab-btn {
      padding:6px 16px; border-radius:6px; border:1px solid var(--border);
      background:transparent; color:var(--text-secondary); font-size:13px;
      font-family:inherit; cursor:pointer; transition:all .15s; font-weight:500;
    }
    .tab-btn:hover { border-color:var(--text-primary); color:var(--text-primary); }
    .tab-btn.active { background:var(--text-primary); color:var(--bg); border-color:var(--text-primary); }
  </style>
</head>
<body>
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-title">日报管理</div>
      <div class="sidebar-nav">
        <a class="nav-item" href="engineers.html">👤 员工管理</a>
        <a class="nav-item" href="projects.html">📁 项目管理</a>
        <a class="nav-item" href="reports.html">📋 日报管理</a>
        <a class="nav-item" href="accounts.html">🔐 权限管理</a>
      </div>
      <div style="padding:12px 20px;border-top:1px solid var(--border)">
        <a class="nav-item" href="javascript:void(0)" onclick="openStatsPanel()" style="padding:8px 0">📈 统计面板</a>
      </div>
    </div>
    <div class="main">
      <div class="topbar">
        <span class="topbar-user" id="topbarUser"></span>
        <span class="topbar-user" id="topbarRole"></span>
        <button class="topbar-btn" onclick="logout()">退出</button>
      </div>

      <div class="action-bar">
        <div class="page-title" style="margin-bottom:0">权限管理</div>
        <button class="btn btn-primary" onclick="showCreateModal()">+ 新建账户</button>
      </div>

      <!-- 标签切换 -->
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="accounts" onclick="switchTab('accounts')">账户列表</button>
        <button class="tab-btn" data-tab="permissions" onclick="switchTab('permissions')">查看权限</button>
      </div>

      <!-- 账户列表 -->
      <div id="tabAccounts" class="card" style="padding:0">
        <table>
          <thead>
            <tr>
              <th>用户名</th>
              <th>角色</th>
              <th>关联工程师</th>
              <th>创建时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="accountTableBody"></tbody>
        </table>
      </div>

      <!-- 权限配置 -->
      <div id="tabPermissions" class="card" style="display:none">
        <div class="section-subtitle">已配置的查看权限（谁可以查看哪些工程师的数据）</div>
        <div id="permList"></div>
      </div>
    </div>
  </div>

  <!-- 新建账户弹窗 -->
  <div class="modal-overlay" id="createModal">
    <div class="modal">
      <div class="modal-title">新建账户</div>
      <div class="form-group">
        <label class="form-label">用户名</label>
        <input class="form-input" id="newUsername" placeholder="请输入用户名">
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input class="form-input" id="newPassword" type="password" placeholder="请输入密码">
      </div>
      <div class="form-group">
        <label class="form-label">角色</label>
        <select class="form-select" id="newRole" onchange="toggleEngineerSelect()">
          <option value="admin">管理员</option>
          <option value="leader">组长</option>
          <option value="engineer">员工</option>
        </select>
      </div>
      <div class="form-group" id="engineerSelectGroup" style="display:none">
        <label class="form-label">关联工程师</label>
        <select class="form-select" id="newEngineerId">
          <option value="">请选择工程师</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeCreateModal()">取消</button>
        <button class="btn btn-primary" id="createBtn" onclick="createAccount()">创建</button>
      </div>
    </div>
  </div>

  <!-- 重置密码弹窗 -->
  <div class="modal-overlay" id="passwordModal">
    <div class="modal">
      <div class="modal-title">重置密码</div>
      <div class="form-group">
        <label class="form-label">新密码</label>
        <input class="form-input" id="resetPassword" type="password" placeholder="请输入新密码">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closePasswordModal()">取消</button>
        <button class="btn btn-primary" id="resetBtn" onclick="resetPassword()">确认</button>
      </div>
    </div>
  </div>

  <!-- 修改角色弹窗 -->
  <div class="modal-overlay" id="roleModal">
    <div class="modal">
      <div class="modal-title">修改角色</div>
      <div class="form-group">
        <label class="form-label">用户名</label>
        <div id="roleUsername" style="font-size:15px;font-weight:600;margin-bottom:12px"></div>
      </div>
      <div class="form-group">
        <label class="form-label">新角色</label>
        <select class="form-select" id="roleSelect">
          <option value="admin">管理员</option>
          <option value="leader">组长</option>
          <option value="engineer">员工</option>
          <option value="viewer">查看者</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeRoleModal()">取消</button>
        <button class="btn btn-primary" id="roleBtn" onclick="updateRole()">确认</button>
      </div>
    </div>
  </div>

  <!-- 权限管理弹窗 -->
  <div class="modal-overlay" id="permModal">
    <div class="modal" style="max-width:500px">
      <div class="modal-title" id="permModalTitle">管理查看权限</div>
      <div class="section-subtitle">选择该账户可以查看哪些工程师的数据</div>
      <div id="permCurrentList" style="margin-bottom:12px"></div>
      <div class="form-group">
        <select class="form-select" id="permAddEngineer" style="width:100%">
          <option value="">添加工程师...</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closePermModal()">关闭</button>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
  <script>
    let currentTab = 'accounts';
    let permAccountId = null;
    let allAccounts = [];

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      document.getElementById('tabAccounts').style.display = tab === 'accounts' ? '' : 'none';
      document.getElementById('tabPermissions').style.display = tab === 'permissions' ? '' : 'none';
      if (tab === 'permissions') loadPermissions();
    }

    // ====== 账户管理 ======

    async function loadAccounts() {
      try {
        const data = (await api('/api/admin/accounts')).data;
        allAccounts = data;
        const tbody = document.getElementById('accountTableBody');
        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state">暂无账户</div></td></tr>';
          return;
        }
        tbody.innerHTML = data.map(a => {
          const roleMap = { admin: '管理员', leader: '组长', engineer: '员工', viewer: '查看者' };
          const badgeCls = { admin: 'badge-active', leader: 'badge-ongoing', engineer: 'badge-info', viewer: 'badge-warning' };
          return `<tr>
            <td><strong>${a.username}</strong></td>
            <td><span class="badge ${badgeCls[a.role] || 'badge-info'}">${roleMap[a.role] || a.role}</span></td>
            <td>${a.engineer_name ? `${a.engineer_name} (${a.engineer_abbr})` : '-'}</td>
            <td>${formatDateTime(a.created_at)}</td>
            <td>
              <div class="btn-group">
                <button class="btn btn-secondary btn-sm" onclick="showRoleModal(${a.id}, '${a.username}', '${a.role}')">修改角色</button>
                <button class="btn btn-secondary btn-sm" onclick="showPermModal(${a.id})">管理权限</button>
                <button class="btn btn-secondary btn-sm" onclick="showPasswordModal(${a.id})">重置密码</button>
                <button class="btn btn-danger btn-sm" onclick="deleteAccount(${a.id}, '${a.username}')">删除</button>
              </div>
            </td>
          </tr>`;
        }).join('');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function toggleEngineerSelect() {
      const role = document.getElementById('newRole').value;
      const group = document.getElementById('engineerSelectGroup');
      group.style.display = role === 'engineer' ? '' : 'none';
    }

    async function loadEngineersForSelect() {
      try {
        const data = (await api('/api/admin/engineers?status=active')).data;
        const sel = document.getElementById('newEngineerId');
        sel.innerHTML = '<option value="">请选择工程师</option>' +
          data.map(e => `<option value="${e.id}">${e.name} (${e.abbr})</option>`).join('');
      } catch (e) {}
    }

    function showCreateModal() {
      document.getElementById('createModal').classList.add('show');
      document.getElementById('newUsername').value = '';
      document.getElementById('newPassword').value = '';
      document.getElementById('newRole').value = 'admin';
      toggleEngineerSelect();
      loadEngineersForSelect();
    }

    function closeCreateModal() {
      document.getElementById('createModal').classList.remove('show');
    }

    async function createAccount() {
      const username = document.getElementById('newUsername').value.trim();
      const password = document.getElementById('newPassword').value;
      const role = document.getElementById('newRole').value;
      const engineer_id = document.getElementById('newEngineerId').value;

      if (!username || !password) { showToast('用户名和密码不能为空', 'error'); return; }
      if (role === 'engineer' && !engineer_id) { showToast('请选择关联工程师', 'error'); return; }

      const btn = document.getElementById('createBtn');
      setLoading(btn, true);
      try {
        await api('/api/admin/accounts', {
          method: 'POST',
          body: JSON.stringify({ username, password, role, engineer_id: engineer_id || null })
        });
        showToast('账户已创建');
        closeCreateModal();
        loadAccounts();
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        setLoading(btn, false);
      }
    }

    function showPasswordModal(id) {
      resetAccountId = id;
      document.getElementById('passwordModal').classList.add('show');
      document.getElementById('resetPassword').value = '';
    }

    function closePasswordModal() {
      resetAccountId = null;
      document.getElementById('passwordModal').classList.remove('show');
    }

    async function resetPassword() {
      const password = document.getElementById('resetPassword').value;
      if (!password) { showToast('密码不能为空', 'error'); return; }
      const btn = document.getElementById('resetBtn');
      setLoading(btn, true);
      try {
        await api(`/api/admin/accounts/${resetAccountId}/password`, {
          method: 'PUT', body: JSON.stringify({ password })
        });
        showToast('密码已重置');
        closePasswordModal();
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        setLoading(btn, false);
      }
    }

    async function deleteAccount(id, username) {
      if (!confirm(`确认删除账户 "${username}"？`)) return;
      try {
        await api(`/api/admin/accounts/${id}`, { method: 'DELETE' });
        showToast('已删除');
        loadAccounts();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // ====== 修改角色 ======

    let roleAccountId = null;

    function showRoleModal(id, username, currentRole) {
      roleAccountId = id;
      document.getElementById('roleUsername').textContent = username + '（当前角色：' +
        ({ admin: '管理员', leader: '组长', engineer: '员工', viewer: '查看者' }[currentRole] || currentRole) + '）';
      document.getElementById('roleSelect').value = currentRole;
      document.getElementById('roleModal').classList.add('show');
    }

    function closeRoleModal() {
      roleAccountId = null;
      document.getElementById('roleModal').classList.remove('show');
    }

    async function updateRole() {
      const role = document.getElementById('roleSelect').value;
      if (!roleAccountId) return;
      const btn = document.getElementById('roleBtn');
      setLoading(btn, true);
      try {
        await api(`/api/admin/accounts/${roleAccountId}/role`, {
          method: 'PUT',
          body: JSON.stringify({ role })
        });
        showToast('角色已更新');
        closeRoleModal();
        loadAccounts();
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        setLoading(btn, false);
      }
    }

    // ====== 权限管理 ======

    async function loadPermissions() {
      try {
        const data = (await api('/api/admin/permissions')).data;
        const container = document.getElementById('permList');
        if (data.length === 0) {
          container.innerHTML = '<div class="empty-state">暂无权限配置</div>';
          return;
        }
        // 按 viewer 分组
        const grouped = {};
        data.forEach(p => {
          if (!grouped[p.viewer_account_id]) grouped[p.viewer_account_id] = { viewer_name: p.viewer_name, engineers: [] };
          grouped[p.viewer_account_id].engineers.push({ id: p.id, name: p.engineer_name, abbr: p.engineer_abbr });
        });
        container.innerHTML = Object.entries(grouped).map(([accId, g]) =>
          `<div style="margin-bottom:12px;padding:10px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm)">
            <div style="font-weight:600;margin-bottom:6px;font-size:13px">${g.viewer_name}</div>
            <div>${g.engineers.map(e => `<span class="perm-badge">${e.name} (${e.abbr})</span>`).join('')}</div>
          </div>`
        ).join('');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function showPermModal(accountId) {
      permAccountId = accountId;
      const account = allAccounts.find(a => a.id === accountId);
      document.getElementById('permModalTitle').textContent = `查看权限 - ${account ? account.username : ''}`;
      document.getElementById('permModal').classList.add('show');
      await loadPermEngineers(accountId);
      await loadPermAddOptions(accountId);
    }

    function closePermModal() {
      permAccountId = null;
      document.getElementById('permModal').classList.remove('show');
    }

    async function loadPermEngineers(accountId) {
      try {
        const data = (await api('/api/admin/permissions')).data;
        const perms = data.filter(p => p.viewer_account_id === accountId);
        const container = document.getElementById('permCurrentList');
        container.innerHTML = perms.length === 0
          ? '<div style="color:var(--text-secondary);font-size:13px;padding:8px 0">暂无权限，请在下方添加</div>'
          : perms.map(p =>
            `<span class="perm-badge">${p.engineer_name} (${p.engineer_abbr})
              <span class="remove" onclick="removePerm(${p.id})">×</span></span>`
          ).join('');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function loadPermAddOptions(accountId) {
      try {
        // 所有在职工程师
        const engineers = (await api('/api/admin/engineers?status=active')).data;
        // 已有权限
        const perms = (await api('/api/admin/permissions')).data.filter(p => p.viewer_account_id === accountId);
        const existingIds = perms.map(p => p.target_engineer_id);
        const sel = document.getElementById('permAddEngineer');
        sel.innerHTML = '<option value="">添加工程师...</option>' +
          engineers.filter(e => !existingIds.includes(e.id))
            .map(e => `<option value="${e.id}">${e.name} (${e.abbr})</option>`).join('');
        sel.onchange = async function() {
          const id = parseInt(this.value);
          if (!id) return;
          try {
            await api('/api/admin/permissions', {
              method: 'POST',
              body: JSON.stringify({ viewer_account_id: accountId, target_engineer_id: id })
            });
            await loadPermEngineers(accountId);
            await loadPermAddOptions(accountId);
            loadPermissions();
          } catch (err) {
            showToast(err.message, 'error');
          }
          this.value = '';
        };
      } catch (err) {}
    }

    async function removePerm(permId) {
      try {
        await api(`/api/admin/permissions/${permId}`, { method: 'DELETE' });
        await loadPermEngineers(permAccountId);
        await loadPermAddOptions(permAccountId);
        loadPermissions();
        showToast('权限已移除');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // 点击遮罩关闭
    document.querySelectorAll('.modal-overlay').forEach(el => {
      el.addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('show');
      });
    });

    loadAccounts();
  </script>
</body>
</html>
