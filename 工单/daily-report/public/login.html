<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 日报管理系统</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-container">
    <div class="login-title">日报管理系统</div>
    <div class="login-subtitle">请登录以继续</div>
    <div class="form-group">
      <label class="form-label">用户名</label>
      <input class="form-input" id="username" type="text" placeholder="请输入用户名" autocomplete="username">
    </div>
    <div class="form-group">
      <label class="form-label">密码</label>
      <input class="form-input" id="password" type="password" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button class="login-btn" id="loginBtn" onclick="doLogin()">
      <span class="btn-text">登录</span>
      <span class="loading-text">处理中...</span>
    </button>
    <div class="error-msg" id="errorMsg"></div>
  </div>
  <script>
    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const errorMsg = document.getElementById('errorMsg');

      if (!username || !password) {
        errorMsg.textContent = '请输入用户名和密码';
        errorMsg.classList.add('show');
        return;
      }

      btn.classList.add('loading');
      btn.disabled = true;
      errorMsg.classList.remove('show');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          window.location.href = data.data.redirect || '/admin/';
        } else {
          errorMsg.textContent = data.message || '登录失败';
          errorMsg.classList.add('show');
        }
      } catch (err) {
        errorMsg.textContent = '网络错误，请重试';
        errorMsg.classList.add('show');
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    }

    // 回车键触发登录
    document.getElementById('password').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });
    document.getElementById('username').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('password').focus();
    });
  </script>
</body>
</html>
